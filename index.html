        currentSentenceSpans.forEach((s, j) => s.el.classList.toggle("sentence-active", j === si));
      }, 300);
    }

    // Split the active chunk into word spans so onboundary can highlight one.
    function buildWordSpans(index) {
      const el = chunkEls[index];
      if (!el) return;
      const text = chunks[index];
      el.textContent = "";
      const spans = [];
      const re = /\S+/g;
      let m, last = 0;
      while ((m = re.exec(text))) {
        if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = m[0];
        el.appendChild(span);
        spans.push({ start: m.index, end: m.index + m[0].length, el: span });
        last = m.index + m[0].length;
      }
      if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
      currentWordSpans = spans;
      wordSpanIndex = index;
      if (sentenceSpanIndex === index) { currentSentenceSpans = []; sentenceSpanIndex = -1; }
    }

    function highlightWordAt(charIndex) {
      const w = currentWordSpans.find(s => charIndex >= s.start && charIndex < s.end);
      if (!w) return;
      currentWordSpans.forEach(s => s.el.classList.toggle("word-active", s === w));
    }

    // Highlight the chunk being spoken, scroll it into view, track progress,
    // and remember the position so the article can resume later.
    function highlightChunk(i) {
      clearWordSpans();
      chunkEls.forEach((el, idx) => el.classList.toggle("active", idx === i));
      const el = chunkEls[i];
      if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      updateProgress();
      savePosition();
      updateMediaSession();
    }

    function speakChunks() {
      if (chunkIndex >= chunks.length) {
        clearInterval(speechTickTimer);
        setStatus("Finished reading.");
        setControls("idle");
        updateNav();
        clearPosition();
        return;
      }

      // Speak from the sentence offset (0 = whole chunk). Highlighting maps
      // the utterance's relative charIndex back to absolute chunk positions.
      const startOffset = chunkCharOffset;
      const utterance = new SpeechSynthesisUtterance(chunks[chunkIndex].slice(startOffset));
      utterance.voice = selectedVoice();
      utterance.rate = Number(rateInput.value);
      utterance.pitch = 1;
      utterance.volume = 1;

      // Keep the controls in sync with what the speech engine actually does.
      utterance.onstart = () => {
        lastBoundaryAbs = startOffset;
        setControls("playing");
        updateNav();
        startSpeechTick(utterance, startOffset, () => boundaryFired);
      };
      utterance.onpause = () => setControls("paused");
      utterance.onresume = () => setControls("playing");

      // Word-level highlight where supported; voices with no boundary events
      // get the time-estimated sentence fallback from startSpeechTick instead.
      let boundaryFired = false;
      utterance.onboundary = (event) => {
        if (utterance !== currentUtterance) return;
        if (event.name && event.name !== "word") return;
        boundaryFired = true;
        // If the fallback already swapped in sentence spans, restore word spans.
        if (sentenceSpanIndex === chunkIndex) buildWordSpans(chunkIndex);
        lastBoundaryAbs = startOffset + event.charIndex;
        highlightWordAt(startOffset + event.charIndex);
      };

      utterance.onend = () => {
        // Ignore the end event of an utterance we've already replaced (e.g. via
        // prev/next or a re-read) so navigation can't double-advance the index.
        if (utterance !== currentUtterance) return;
        chunkCharOffset = 0;
        chunkIndex += 1;
        speakChunks();
      };

      utterance.onerror = (event) => {
        // "interrupted"/"canceled" fire on a deliberate skip or re-read; not errors.
        if (event.error === "interrupted" || event.error === "canceled") return;
        if (utterance !== currentUtterance) return;
        // Autoplay blocked (e.g. article shared in with no user gesture yet):
        // keep everything loaded and wait for a tap on play.
        if (event.error === "not-allowed") {
          setControls("paused");
          setStatus("Tap ▶ to start listening.");
          return;
        }
        setStatus("Speech playback failed. Try another voice.");
        setControls("idle");
      };

      currentUtterance = utterance;
      highlightChunk(chunkIndex);
      buildWordSpans(chunkIndex);  // no-op visually until onboundary fires
      setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
      speechSynthesis.speak(utterance);
    }

    // --- Cloudflare engine -------------------------------------------------

    async function fetchCfAudio(text) {
      // Reuse already-generated audio (saves latency and daily quota).
      const cacheKey = cfCacheKey(text);
      if (audioCache.has(cacheKey)) return audioCache.get(cacheKey);

      const key = cfKey.value.trim();
      if (!key) { const e = new Error("no-key"); e.code = "no-key"; throw e; }
      let res;
      try {
        res = await fetch(CF_WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Key": key },
          body: JSON.stringify({
            model: cfModel.value,
            voice: activeCfVoice,
            text,
            lang: "en",
          }),
        });
      } catch {
        const e = new Error("network"); e.code = "network"; throw e;
      }
      if (res.status === 401) { const e = new Error("unauthorized"); e.code = "unauthorized"; throw e; }
      if (!res.ok) {
        // The Worker reports why: { error, detail }, with 429 for quota.
        let body = null;
        try { body = await res.json(); } catch {}
        const detail = (body && body.detail) || (body && body.error) || "";
        const quota = res.status === 429 || /quota|capacity|neurons|rate.?limit|exceeded/i.test(detail);
        const e = new Error("server");
        e.code = quota ? "quota" : "server";
        e.detail = detail;
        e.status = res.status;
        throw e;
      }
      const blob = await res.blob();
      cacheAudio(cacheKey, blob);
      return blob;
    }

    function handleCfError(error) {
      if (error.code === "no-key") {
        setStatus("Enter your premium access key, or untick “Use premium voice”.");
        premiumSection.open = true;  // the key field is inside a collapsed <details>
        cfKey.focus();
      } else if (error.code === "unauthorized") {
        setStatus("Access key rejected — check your key.");
        premiumSection.open = true;
      } else if (error.code === "quota") {
        setStatus("Premium voice failed: daily Workers AI quota reached. It resets at midnight UTC — until then, use a built-in voice.");
      } else if (error.code === "network") {
        setStatus("Premium voice failed: network error. Check your connection and retry.");
      } else {
        const why = error.detail ? `: ${error.detail}` : (error.status ? ` (HTTP ${error.status})` : "");
        setStatus(`Premium voice failed${why}. Retry, or use a built-in voice.`);
      }
      setControls("idle");
    }

    // When Workers AI quota/capacity runs out mid-article, degrade through
    // the premium tiers (Aura-2 -> Aura-1 -> MeloTTS) and finally to the
    // free browser voice, keeping the listening position. The degraded tier is
    // deliberately not saved (see preferredCf): the daily quota resets, so the
    // next article starts over at the most capable voice. The short delay
    // lets the user read the status message; the token guard drops the
    // retry if they navigate or stop in the meantime.
    function quotaFallback() {
      const t = cfPlayToken;
      const retry = (fn) => setTimeout(() => { if (t === cfPlayToken) fn(); }, 1500);
      if (cfModel.value === "aura-2" || cfModel.value === "aura-1") {
        const next = cfModel.value === "aura-2" ? "aura-1" : "melotts";
        setStatus(`Premium quota reached for this voice — switching to ${next === "aura-1" ? "Aura-1" : "MeloTTS"}...`);
        cfModel.value = next;
        syncCfModelUi();
        retry(playCloudflareChunk);
      } else {
        setStatus("Premium quota reached — switching to the free browser voice...");
        cfEnable.checked = false;
        // Nothing left to configure until the quota resets — fold the section
        // away (it opens by default, and re-opens if a key is ever needed).
        premiumSection.open = false;
        // Re-chunk for the browser engine, mapping the position by characters
        // (robust even if the engines' chunk sizes ever diverge again).
        const consumed = chunks.slice(0, chunkIndex).reduce((n, c) => n + c.length + 1, 0) + chunkCharOffset;
        retry(() => readText(textArea.value, 0, consumed));
      }
    }

    async function playCloudflareChunk() {
      if (chunkIndex >= chunks.length) {
        setStatus("Finished reading.");
        setControls("idle");
        clearPosition();
        return;
      }
      const token = ++cfPlayToken;
      highlightChunk(chunkIndex);
      buildSentenceSpans(chunkIndex);  // highlighted as the audio progresses
      setStatus(`Generating audio (part ${chunkIndex + 1} of ${chunks.length})`, true);
      try {
        const blob = await fetchCfAudio(chunks[chunkIndex]);
        if (token !== cfPlayToken) return;  // superseded by a skip/stop/re-read
        cfPrepared = -1;  // any preloaded chunk is no longer the one after this
        const el = setCfSource(cfActive, blob);
        wireCfHandlers(el, token);

        await el.play();
        if (token !== cfPlayToken) return;
        // Sentence offsets map to time proportionally (TTS pace is steady).
        if (chunkCharOffset > 0 && isFinite(el.duration) && el.duration > 0) {
          el.currentTime = (chunkCharOffset / chunks[chunkIndex].length) * el.duration;
        }
        setControls("playing");
        setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
        prepareNextCfChunk(token);  // load the next chunk before this one ends
      } catch (error) {
        if (token !== cfPlayToken) return;
        // Autoplay blocked (shared-in article, no user gesture yet): the src
        // is loaded, so a tap on play resumes from here.
        if (error && error.name === "NotAllowedError") {
          setControls("paused");
          setStatus("Tap ▶ to start listening.");
          return;
        }
        if (error && error.code === "quota") {
          quotaFallback();
          return;
        }
        handleCfError(error);
      }
    }

    // Point one of the two elements at a chunk's audio, taking ownership of the
    // blob URL it replaces. Setting src resets playbackRate, so re-apply it.
    function setCfSource(slot, blob) {
      const el = cfPlayers[slot];
      if (cfObjectUrls[slot]) URL.revokeObjectURL(cfObjectUrls[slot]);
      cfObjectUrls[slot] = URL.createObjectURL(blob);
      el.src = cfObjectUrls[slot];
      el.playbackRate = liveRate();   // setting src resets it; keep any hold boost
      el.load();  // start buffering now, not at play() time
      return el;
    }

    function wireCfHandlers(el, token) {
      el.onended = () => {
        if (token !== cfPlayToken) return;
        advanceCfChunk();
      };
      el.onerror = () => {
        if (token !== cfPlayToken) return;
        handleCfError(new Error("server"));
      };
    }

    // Fetch and buffer the chunk *after* the current one into the idle element
    // while the current one is still playing. Best effort: on failure the
    // handoff just falls back to the fetch-then-play path.
    async function prepareNextCfChunk(token) {
      const next = chunkIndex + 1;
      if (next >= chunks.length) return;
      try {
        const blob = await fetchCfAudio(chunks[next]);
        // Bail if playback moved on (skip, stop, or the chunk already advanced).
        if (token !== cfPlayToken || chunkIndex + 1 !== next) return;
        const el = setCfSource(1 - cfActive, blob);
        el.onended = null;
        // A load failure only invalidates the preload, it isn't a play error.
        el.onerror = () => { if (cfPrepared === next) cfPrepared = -1; };
        cfPrepared = next;
      } catch {
        cfPrepared = -1;
      }
    }

    // Chunk handoff, driven by `ended` — which still fires with the screen off.
    // Nothing may be awaited before play(): the platform can suspend the page
    // in a silent gap, which is exactly what used to stop playback mid-article.
    // So when the next chunk is already buffered we swap elements and start it
    // synchronously, and only then queue the following one.
    function advanceCfChunk() {
      const token = cfPlayToken;
      chunkCharOffset = 0;
      chunkIndex += 1;
      if (chunkIndex >= chunks.length) {
        setStatus("Finished reading.");
        setControls("idle");
        clearPosition();
        return;
      }
      if (cfPrepared !== chunkIndex) {
        playCloudflareChunk();  // not preloaded (slow network): fetch it now
        return;
      }
      // The outgoing element is done with; unwire it so a late ended/error
      // event on it can't advance the chunk a second time.
      const finished = cfAudio();
      finished.onended = null;
      finished.onerror = null;
      cfActive = 1 - cfActive;
      cfPrepared = -1;
      const el = cfAudio();
      wireCfHandlers(el, token);
      el.playbackRate = Number(rateInput.value);
      highlightChunk(chunkIndex);
      buildSentenceSpans(chunkIndex);
      setControls("playing");
      setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
      el.play().then(() => prepareNextCfChunk(token)).catch(() => {
        if (token !== cfPlayToken) return;
        playCloudflareChunk();  // refused (rare in background): retry the long way
      });
    }

    // --- Screen wake lock (browser engine only) ----------------------------
    // speechSynthesis suspends when the screen locks — no web API can prevent
    // that — so keep the screen awake while the browser voice is playing.
    // Premium audio plays fine with the screen off, so it takes no lock.
    // Best-effort: failures and unsupported browsers are silently ignored.
    let wakeLock = null;

    async function syncWakeLock() {
      const want = playbackState === "playing" && activeEngine() === "browser";
      if (want && !wakeLock && "wakeLock" in navigator) {
        try {
          const lock = await navigator.wakeLock.request("screen");
          // Playback may have paused/stopped while the request was in flight.
          if (playbackState === "playing" && activeEngine() === "browser") {
            wakeLock = lock;
            lock.addEventListener("release", () => {
              if (wakeLock === lock) wakeLock = null;
            });
          } else {
            lock.release().catch(() => {});
          }
        } catch {}
      } else if (!want && wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      // The platform releases wake locks when the tab is hidden; re-acquire.
      syncWakeLock();
      // If something outside our control (low memory, an interrupting call)
      // paused premium audio while we were backgrounded, pick it back up.
      const el = cfAudio();
      if (playbackState === "playing" && activeEngine() === "cloudflare" &&
          el.paused && el.currentSrc) {
        el.play().catch(() => {});
      }
    });

    // Highlight the sentence currently being spoken by the premium engine,
    // estimated from playback time (fires ~4x/sec — plenty for sentences).
    // Both elements report it; only the one currently playing matters.
    cfPlayers.forEach((player) => {
      player.addEventListener("timeupdate", () => {
        if (player !== cfAudio()) return;
        if (sentenceSpanIndex !== chunkIndex || !currentSentenceSpans.length) return;
        const d = player.duration;
        if (!isFinite(d) || d <= 0) return;
        const pos = (player.currentTime / d) * chunks[chunkIndex].length;
        const si = sentenceIndexAt(chunkIndex, pos);
        currentSentenceSpans.forEach((s, j) => s.el.classList.toggle("sentence-active", j === si));
      });
    });

    // --- Shared playback ---------------------------------------------------

    // Stop whichever engine is active and invalidate pending async work.
    function stopAll() {
      cfPlayToken++;
      clearInterval(speechTickTimer);
      speechSynthesis.cancel();
      currentUtterance = null;
      // Reset (don't discard) the persistent premium elements so they keep
      // their user-activation and can be replayed from the background. This
      // also drops the preloaded next chunk, which is no longer next.
      cfPrepared = -1;
      cfPlayers.forEach((el, i) => {
        el.pause();
        el.onended = null;
        el.onerror = null;
        el.removeAttribute("src");
        el.load();  // abort + release the current resource
        if (cfObjectUrls[i]) {
          URL.revokeObjectURL(cfObjectUrls[i]);
          cfObjectUrls[i] = null;
        }
      });
      clearWordSpans();
    }

    // Spotify-style prev: restart the current section; only a quick second
    // press (within PREV_DOUBLE_MS) goes back to the previous section.
    const PREV_DOUBLE_MS = 1000;
    let lastPrevTime = 0;

    function handlePrev() {
      const now = Date.now();
      const target = now - lastPrevTime < PREV_DOUBLE_MS ? chunkIndex - 1 : chunkIndex;
      lastPrevTime = now;
      playFrom(target);
    }

    // Jump to a chunk (optionally a sentence offset within it) and play from
    // there (used by prev/next, sentence steps, seeks, and re-reads).
    function playFrom(index, charOffset = 0) {
      if (!chunks.length) return;
      chunkIndex = Math.max(0, Math.min(index, chunks.length - 1));
      chunkCharOffset = Math.max(0, Math.min(charOffset, chunks[chunkIndex].length - 1));
      stopAll();
      setControls("playing");
      if (activeEngine() === "cloudflare") {
        playCloudflareChunk();
      } else {
        speakChunks();
        // If paused before skipping, some engines stay paused after
        // cancel()+speak(); resume() is a no-op when already playing.
        speechSynthesis.resume();
      }
    }

    function readText(text, startIndex = 0, startChar = null) {
      // Collapse runs of spaces but keep the line breaks: they carry the
      // article's structure (headings, list items) into chunkArticle().
      let lines = text
        .split(/\r?\n/)
        .map(l => l.replace(/\s+/g, " ").trim())
        .filter(Boolean);
      // Also trim here, so pasted text gets the same treatment as an extracted
      // article — but skip text that cleanArticle() just produced, which is
      // trimmed already and whose drop list is the one the UI is showing.
      if (trimExtras.checked && lines.join("\n") !== cleanedSource) {
        trimmedLines = [];
        lines = stripBoilerplate(lines, "", trimmedLines);
      }
      const cleaned = lines.join("\n");
      if (!cleaned) {
        setStatus("Paste or load article text first.");
        return;
      }
      const engine = activeEngine();
      // Draw the narrator for this reading (a no-op unless "Random" is chosen).
      if (engine === "cloudflare") resolveCfVoice();
      stopAll();
      chunks = chunkArticle(cleaned, CHUNK_SIZE);
      computeSentenceStarts();
      chunkIndex = Math.max(0, Math.min(startIndex, chunks.length - 1));
      chunkCharOffset = 0;
      // A character-based start position (used when switching engines, whose
      // chunk sizes differ) overrides the chunk index; snap to its sentence.
      if (startChar != null) {
        let acc = 0, idx = 0;
        for (let i = 0; i < chunks.length; i++) {
          idx = i;
          if (startChar < acc + chunks[i].length) break;
          acc += chunks[i].length + 1;
        }
        chunkIndex = idx;
        const starts = sentenceStarts[idx] || [0];
        chunkCharOffset = starts[sentenceIndexAt(idx, Math.max(0, startChar - acc))];
      }
      renderChunks();
      // Optimistically enable controls; the engine confirms "playing".
      setControls("playing");
      if (engine === "cloudflare") {
        playCloudflareChunk();
      } else {
        speakChunks();
      }
    }

    // Play an article straight from the text saved with its resume position —
    // no network at all. Used when offline and when extraction fails.
    function playCached(url, pos) {
      rawArticle = "";           // no raw extraction to re-clean from
      trimHost = siteKey(url);
      trimmedLines = [];         // the cached text was already trimmed
      articleTitle = pos.title || titleFromUrl(url);
      textArea.value = pos.text;
      currentUrl = url;
      readText(pos.text, 0, pos.index > 0
        ? Math.floor((pos.index / Math.max(pos.total || 1, 1)) * pos.text.length)
        : null);
      setStatus(`Playing the saved copy of this article${navigator.onLine ? "" : " (offline)"}`);
    }

    async function loadArticle() {
      const url = urlInput.value.trim();
      if (!/^https?:\/\//i.test(url)) {
        setStatus("Enter a valid article URL starting with http or https.");
        return;
      }

      // Every new article starts at the user's chosen premium tier — normally
      // Aura-2 — even if the previous one was degraded by a quota fallback.
      restorePreferredCf();
      trimHost = siteKey(url);   // this site's "keep this line" corrections

      loadButton.disabled = true;
      setStatus("Extracting article text", true);

      // Offline (or a dead network): fall back to the text cached with this
      // article's resume position, so a saved article still plays.
      if (!navigator.onLine) {
        const cached = getPosition(url);
        if (cached && cached.text) {
          playCached(url, cached);
          loadButton.disabled = false;
          return;
        }
      }

      try {
        const readerUrl = `https://r.jina.ai/${url}`;
        // Ask Jina for clean plain text without images, and drop common page
        // chrome (nav/header/footer/sidebars) so it isn't read aloud.
        const response = await fetch(readerUrl, {
          headers: {
            "X-Return-Format": "text",
            "X-Retain-Images": "none",
            // Structural landmarks (safe everywhere) + conventional boilerplate
            // class names. Deliberately NOT <table> — old sites use it for layout.
            "X-Remove-Selector": [
              "nav", "header", "footer", "form", "aside",
              "[role=navigation]", "[role=banner]", "[role=contentinfo]",
              "[role=search]", "[role=complementary]", "[role=dialog]",
              ".infobox", ".navbox", ".toc", ".sidebar", ".breadcrumb", ".breadcrumbs",
              ".cookie", ".cookies", ".newsletter", ".advertisement", ".advert", ".ads", ".promo",
              ".social", ".social-share", ".share", ".sharing", ".related", ".related-articles",
              // Article furniture: cheaper to drop here than to regex out later.
              // Deliberately NOT <time> — plenty of sites use it mid-sentence.
              "figcaption", ".byline", ".author", ".author-bio", ".meta", ".post-meta",
              ".entry-meta", ".article-meta", ".date", ".published", ".timestamp",
              ".tags", ".comments", "#comments", ".paywall", ".subscribe", ".newsletter-signup",
              "[aria-label*=share]", "[class*=share-button]",
            ].join(","),
          },
        });
        if (!response.ok) throw new Error("Could not extract this article.");

        const raw = await response.text();
        setStatus("Cleaning up the text", true);
        // Use Jina's "Title:" line when present; otherwise derive from the URL.
        // Resolved before cleaning, which uses it to drop a repeated headline.
        const titleMatch = raw.match(/^Title:\s*(.+)$/mi);
        const jinaTitle = titleMatch ? titleMatch[1].trim() : "";
        articleTitle = jinaTitle || titleFromUrl(url);

        const text = cleanArticle(raw, articleTitle);
        if (text.length < 80) throw new Error("The extracted article was too short.");
        // Text mode returns no "Title:" line, so prefer the article's own first
        // heading over the URL slug now that the text is clean.
        articleTitle = deriveTitle(text, url, jinaTitle);

        rawArticle = raw;  // kept so the trim checkbox can re-clean this article
        textArea.value = text;
        currentUrl = url;
        // Resume where this article was last left off, if recent. Map the
        // saved chunk position proportionally to characters, so it survives
        // chunk-size changes (tuned constants, or a different engine).
        const pos = getPosition(url);
        readText(text, 0, pos && pos.index > 0
          ? Math.floor((pos.index / Math.max(pos.total || 1, 1)) * text.length)
          : null);
        if (pos && pos.index > 0) {
          setStatus(`Resuming at part ${chunkIndex + 1} of ${chunks.length}`, true);
        }
      } catch (error) {
        // Extraction failed. If this article was played before, its text is
        // cached with the resume position — use that rather than giving up.
        const cached = getPosition(url);
        if (cached && cached.text) {
          playCached(url, cached);
          loadButton.disabled = false;
          return;
        }
        // Nothing will play, so make sure controls reflect idle.
        setControls("idle");
        setStatus(`${error.message} Paste the article text below and press "Read pasted text".`);
      } finally {
        loadButton.disabled = false;
      }
    }

    // Live feedback while dragging: label, and premium audio (which supports
    // live speed changes, unlike speechSynthesis).
    function applyRate() {
      const rate = Number(rateInput.value);
      rateValue.textContent = rate.toFixed(2);
      cfPlayers.forEach((el) => { el.playbackRate = liveRate(); });
      rateDown.disabled = rate <= Number(rateInput.min);
      rateUp.disabled = rate >= Number(rateInput.max);
      updateFsMeta();
    }

    // The rate actually applied to audio right now: the slider's, unless a
    // press-and-hold boost is active. Kept separate from the slider so the
    // boost is never persisted and never re-speaks the browser engine.
    function liveRate() {
      const rate = Number(rateInput.value) || 1;
      return boostRate ? Math.min(Number(rateInput.max), rate * boostRate) : rate;
    }

    function setBoost(on) {
      // Premium only: speechSynthesis can't change rate mid-utterance, so a
      // hold gesture there would mean re-speaking the sentence twice.
      if (on && (activeEngine() !== "cloudflare" || playbackState !== "playing")) return;
      if (!on && !boostRate) return;
      boostRate = on ? 2 : 0;
      cfPlayers.forEach((el) => { el.playbackRate = liveRate(); });
      boostPill.classList.toggle("active", Boolean(boostRate));
      if (boostRate) boostPill.textContent = `${liveRate().toFixed(2)}×`;
    }

    // speechSynthesis can't change rate mid-utterance, so once the new speed is
    // settled, re-speak from the current sentence (only while actively playing).
    function commitRate() {
      savePrefs();
      if (playbackState === "playing" && activeEngine() === "browser") {
        const starts = sentenceStarts[chunkIndex] || [0];
        playFrom(chunkIndex, starts[sentenceIndexAt(chunkIndex, currentCharPos())]);
      }
    }

    rateInput.addEventListener("input", applyRate);
    rateInput.addEventListener("change", commitRate);

    // The -/+ buttons move by one slider step, which is much easier to hit
    // precisely than the thumb — especially on a phone.
    function nudgeRate(delta) {
      const value = Number(rateInput.value);
      const next = Math.min(Number(rateInput.max), Math.max(Number(rateInput.min), value + delta));
      const rounded = Math.round(next * 100) / 100;  // keep 0.05 steps exact
      if (rounded === value) return;
      rateInput.value = rounded;
      applyRate();
      commitRate();
    }

    rateDown.addEventListener("click", () => nudgeRate(-0.05));
    rateUp.addEventListener("click", () => nudgeRate(0.05));

    loadButton.addEventListener("click", loadArticle);
    readTextButton.addEventListener("click", () => {
      currentUrl = "";  // pasted text isn't tied to a URL, so don't resume it
      articleTitle = "Pasted text";
      readText(textArea.value);
    });

    // Re-read the already-loaded text when the chosen voice/engine changes —
    // no need to re-fetch from Jina, since the content is in the textarea.
    // Keep the position by character count so it survives any re-chunking
    // (a raw chunk index wouldn't if chunk sizing ever changes).
    function reReadIfLoaded() {
      if (!textArea.value.trim()) return;
      const consumed = chunks.slice(0, chunkIndex).reduce((n, c) => n + c.length + 1, 0) + chunkCharOffset;
      readText(textArea.value, 0, chunks.length ? consumed : null);
    }
    voiceSelect.addEventListener("change", () => { savePrefs(); reReadIfLoaded(); });

    function togglePlayPause() {
      if (playbackState === "playing") {
        if (activeEngine() === "cloudflare") {
          cfAudio().pause();
        } else {
          speechSynthesis.pause();
        }
        setControls("paused");
      } else if (playbackState === "paused") {
        if (activeEngine() === "cloudflare") {
          cfAudio().play().catch(() => {});
        } else if (speechSynthesis.paused) {
          speechSynthesis.resume();
        } else {
          // Nothing to resume — speech never started (blocked autoplay after
          // a share). Re-speak the current chunk; playFrom sets the controls.
          playFrom(chunkIndex);
          return;
        }
        setControls("playing");
      }
    }
    playPauseButton.addEventListener("click", togglePlayPause);
    restartButton.addEventListener("click", () => playFrom(0));
    prevButton.addEventListener("click", handlePrev);
    nextButton.addEventListener("click", () => playFrom(chunkIndex + 1));
    prevSentenceButton.addEventListener("click", () => stepSentence(-1));
    nextSentenceButton.addEventListener("click", () => stepSentence(1));

    // Tap the progress bar to jump anywhere in the article.
    progressEl.addEventListener("click", (e) => {
      if (!chunks.length || playbackState === "idle") return;
      const rect = progressEl.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      playFrom(Math.floor(pct * chunks.length));
    });

    // Keyboard shortcuts: Space/K play-pause, arrows skip. Ignored while typing.
    document.addEventListener("keydown", (e) => {
      // Escape leaves full-screen reading mode even when nothing is playing —
      // and even from a focused control, since the full-screen toolbar's speed
      // buttons and slider are the things most likely to hold focus there.
      if (e.key === "Escape" && document.body.classList.contains("immersive")) {
        e.preventDefault();
        toggleImmersive(false);
        return;
      }
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                t.tagName === "SELECT" || t.tagName === "BUTTON" ||
                t.isContentEditable)) return;
      if (playbackState === "idle") return;
      if (e.key === " " || e.key === "k") {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (!prevButton.disabled) handlePrev();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        if (!nextButton.disabled) playFrom(chunkIndex + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        stepSentence(-1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        stepSentence(1);
      }
    });

    // --- Media Session (lock-screen / headphone controls) ------------------
    // Works for premium audio on all platforms; for the browser voice it
    // appears where the platform attaches a media session to speech.
    function setupMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const ms = navigator.mediaSession;
      const set = (action, fn) => { try { ms.setActionHandler(action, fn); } catch {} };
      set("play", () => { if (playbackState === "paused") togglePlayPause(); });
      set("pause", () => { if (playbackState === "playing") togglePlayPause(); });
      set("previoustrack", () => { if (!prevButton.disabled) handlePrev(); });
      set("nexttrack", () => { if (!nextButton.disabled) playFrom(chunkIndex + 1); });
      set("seekbackward", () => { if (!prevButton.disabled) handlePrev(); });
      set("seekforward", () => { if (!nextButton.disabled) playFrom(chunkIndex + 1); });
    }

    function updateMediaSession() {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.playbackState =
        playbackState === "playing" ? "playing" :
        playbackState === "paused" ? "paused" : "none";
      if (chunks.length && "MediaMetadata" in window) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: articleTitle || "Article",
          artist: `Part ${chunkIndex + 1} of ${chunks.length}`,
          album: "Article Reader",
        });
      }
    }

    // --- Premium (Cloudflare) controls ------------------------------------

    function auraVoiceList() {
      return cfModel.value === "aura-2" ? AURA2_VOICES : AURA_VOICES;
    }

    function voiceLabel(name) {
      return name.charAt(0).toUpperCase() + name.slice(1);
    }

    function populateAuraVoices() {
      cfVoice.innerHTML = "";
      // The default: a different narrator per article, rather than always the
      // same one. Still overridable by picking a specific voice below it.
      const random = document.createElement("option");
      random.value = RANDOM_VOICE;
      random.textContent = "Random";
      random.selected = true;
      cfVoice.appendChild(random);
      auraVoiceList().forEach((name) => {
        const o = document.createElement("option");
        o.value = name;
        o.textContent = voiceLabel(name);
        cfVoice.appendChild(o);
      });
    }

    // Turn the "Random" choice into a concrete voice. Resolved once per reading
    // (and per model change, since the two Aura models offer different voices)
    // rather than per chunk, so one article is read by one narrator throughout.
    function resolveCfVoice() {
      const list = auraVoiceList();
      activeCfVoice = cfVoice.value === RANDOM_VOICE
        ? list[Math.floor(Math.random() * list.length)]
        : cfVoice.value;
      // Name the pick in the option itself, so the voice being used is visible.
      const option = cfVoice.querySelector(`option[value="${RANDOM_VOICE}"]`);
      if (option) {
        option.textContent = cfVoice.value === RANDOM_VOICE
          ? `Random (${voiceLabel(activeCfVoice)})`
          : "Random";
      }
      return activeCfVoice;
    }

    function syncCfModelUi() {
      // Aura models have selectable voices; MeloTTS does not.
      cfVoice.disabled = cfModel.value === "melotts";
      populateAuraVoices();
      resolveCfVoice();
    }

    // Any manual change is a new *choice*, so it becomes the tier restored for
    // later articles (unlike an automatic quota degradation).
    cfEnable.addEventListener("change", () => { snapshotCfPrefs(); savePrefs(); reReadIfLoaded(); });
    cfModel.addEventListener("change", () => { syncCfModelUi(); snapshotCfPrefs(); savePrefs(); reReadIfLoaded(); });
    cfVoice.addEventListener("change", () => { resolveCfVoice(); snapshotCfPrefs(); savePrefs(); reReadIfLoaded(); });
    // --- Touch gestures on the reading view ---------------------------------
    // The phone is the primary device here, and it had only buttons. A pointer
    // that moved or was held is a gesture, not a tap, so `suppressClick` stops
    // it also landing as a tap-to-seek on the sentence underneath.
    const SWIPE_MIN = 50;        // px before a drag counts as a swipe
    const TAP_SLOP = 10;         // px of movement still considered a tap
    const HOLD_MS = 400;         // press-and-hold before the speed boost kicks in
    let pointerStart = null;
    let holdTimer = null;
    let suppressClick = false;

    readerEl.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pointerStart = { x: e.clientX, y: e.clientY, t: Date.now() };
      suppressClick = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        setBoost(true);
        if (boostRate) suppressClick = true;
      }, HOLD_MS);
    });

    readerEl.addEventListener("pointermove", (e) => {
      if (!pointerStart) return;
      if (Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y) > TAP_SLOP) {
        clearTimeout(holdTimer);   // a drag is a swipe or a scroll, not a hold
      }
    });

    const endPointer = (e) => {
      clearTimeout(holdTimer);
      if (boostRate) { setBoost(false); suppressClick = true; }
      if (!pointerStart) return;
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      pointerStart = null;
      if (playbackState === "idle") return;
      if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.5) {
        // Swipe left = forward, matching the direction the text would move.
        stepSentence(dx < 0 ? 1 : -1);
        suppressClick = true;
      } else if (dy > SWIPE_MIN * 1.6 && Math.abs(dy) > Math.abs(dx) * 1.5 &&
                 document.body.classList.contains("immersive") && readerEl.scrollTop <= 0) {
        toggleImmersive(false);    // swipe down out of full screen, from the top
        suppressClick = true;
      }
    };
    readerEl.addEventListener("pointerup", endPointer);
    readerEl.addEventListener("pointercancel", () => {
      clearTimeout(holdTimer);
      setBoost(false);
      pointerStart = null;
    });

    fontDown.addEventListener("click", () => nudgeReadScale(-0.1));
    fontUp.addEventListener("click", () => nudgeReadScale(0.1));
    immersiveButton.addEventListener("click", () => toggleImmersive());
    // Tapping the reader's margin (not a sentence) pauses — on a phone the
    // reading pane is most of the screen and the play button is a small target.
    readerEl.addEventListener("click", (e) => {
      if (suppressClick) { suppressClick = false; return; }
      if (e.target === readerEl && playbackState !== "idle") togglePlayPause();
    });

    // Toggling the trim re-cleans the loaded article in place, keeping the
    // listening spot (mapped by characters, since the text length changes).
    trimExtras.addEventListener("change", () => {
      savePrefs();
      if (rawArticle) recleanInPlace(); else reReadIfLoaded();
    });
    // Persist the access key locally; never leaves this browser except to the Worker.
    cfKey.addEventListener("change", () => {
      localStorage.setItem(CF_KEY_STORAGE, cfKey.value.trim());
    });

    // Restore saved preferences (voice is restored later, in loadVoices).
    const savedPrefs = loadJson(PREFS_STORAGE);
    if (savedPrefs.rate) rateInput.value = savedPrefs.rate;
    applyRate();  // label + bounds for the -/+ buttons
    // Trimming is on unless it was explicitly switched off (any prefs version:
    // it carries no quota history, so it needs no PREFS_VERSION gate).
    if (typeof savedPrefs.trim === "boolean") trimExtras.checked = savedPrefs.trim;
    if (Number(savedPrefs.read) >= 0.85 && Number(savedPrefs.read) <= 1.8) readScale = Number(savedPrefs.read);
    applyReadScale();
    // Premium prefs are only honoured from PREFS_VERSION onwards; older entries
    // may have a quota degradation baked in, so fall back to the markup
    // defaults (premium on, Aura-2 — the most capable tier).
    const cfPrefsTrusted = savedPrefs.v === PREFS_VERSION;
    if (cfPrefsTrusted && typeof savedPrefs.cfEnable === "boolean") cfEnable.checked = savedPrefs.cfEnable;
    if (cfPrefsTrusted && savedPrefs.cfModel) cfModel.value = savedPrefs.cfModel;
    syncCfModelUi();  // sets the disabled state and populates voices for the model
    if (cfPrefsTrusted && savedPrefs.cfVoice) cfVoice.value = savedPrefs.cfVoice;  // after populate
    snapshotCfPrefs();  // this is the tier every new article returns to

    cfKey.value = localStorage.getItem(CF_KEY_STORAGE) || "";

    setControls("idle");
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
    setupMediaSession();

    // Needed for installability and the PWA share target. No-op on file://.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    // --- Shared-in URLs (PWA share target / ?url= deep link) ---------------
    // The manifest's share_target delivers shares as GET query params.
    // Android usually puts the link inside `text` rather than `url`.
    (function handleSharedUrl() {
      const params = new URLSearchParams(location.search);
      const fromText = (params.get("text") || params.get("title") || "").match(/https?:\/\/\S+/);
      const shared = params.get("url") || (fromText && fromText[0]) || "";
      if (!/^https?:\/\//i.test(shared)) return;
      history.replaceState(null, "", location.pathname);  // don't re-trigger on reload
      urlInput.value = shared;
      loadArticle();  // if autoplay is blocked, this lands on paused + "Tap ▶"
    })();
  </script>
</body>
</html>
