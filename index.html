<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8A%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#6d5efc" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      color-scheme: light dark;
      --accent: #6d5efc;
      --accent-2: #b14bf4;
      --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
      --ring: color-mix(in srgb, var(--accent) 45%, transparent);
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 56px;
      line-height: 1.55;
      background: radial-gradient(1100px 420px at 50% -160px,
        color-mix(in srgb, var(--accent) 24%, transparent), transparent);
    }
    .card {
      border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
      border-radius: 18px;
      padding: 24px;
      background: color-mix(in srgb, Canvas 94%, var(--accent) 4%);
      box-shadow: 0 14px 44px rgb(0 0 0 / 0.12);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.intro { margin: 0 0 20px; opacity: 0.75; }
    label { display: block; font-weight: 650; margin: 16px 0 7px; }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      border-radius: 11px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      padding: 12px;
      background: Canvas;
      color: CanvasText;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    input[type="range"] {
      border: none; background: transparent; padding: 0;
      accent-color: var(--accent);
    }
    textarea { min-height: 150px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      cursor: pointer;
      margin-top: 12px;
      font-weight: 700;
      border: none;
      transition: transform .05s ease, filter .15s ease, background .2s ease;
    }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 6px 18px var(--accent-soft);
    }
    button.primary:hover { filter: brightness(1.06); }
    #readTextButton { background: color-mix(in srgb, var(--accent) 12%, Canvas); color: CanvasText; }
    button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    button.toggle {
      font-size: 22px; line-height: 1; padding: 12px;
      background: color-mix(in srgb, var(--accent) 14%, Canvas);
      color: CanvasText;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    button.toggle:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 24%, Canvas); }
    #playPauseButton:not(:disabled) {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff; border: none;
    }
    /* Speed slider flanked by -/+ nudge buttons, for one-step (0.05) changes
       that are far easier to hit than dragging the thumb on a phone. */
    .speed { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    button.nudge {
      width: 40px; margin: 0; padding: 7px 0;
      font-size: 19px; line-height: 1;
      background: color-mix(in srgb, var(--accent) 14%, Canvas);
      color: CanvasText;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    button.nudge:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 24%, Canvas); }
    .premium, details.manual {
      margin-top: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 13px;
      padding: 12px 14px;
    }
    summary { font-weight: 650; cursor: pointer; }
    .premium .row { margin-top: 8px; }
    .premium .check {
      display: flex; align-items: center; gap: 8px;
      font-weight: 650; margin: 12px 0 4px;
    }
    .premium .check input { width: auto; }
    .check.standalone {
      display: flex; align-items: center; gap: 8px;
      margin: 14px 0 0; font-size: 14px; cursor: pointer;
    }
    .check.standalone input { width: auto; }
    .premium input[type="password"] { margin-top: 6px; }
    /* Progress bar across the whole article. Tappable to seek: the visible
       track is 6px; vertical padding widens the touch target invisibly. */
    #progress {
      margin-top: 14px;
      height: 18px;
      padding: 6px 0;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      background-clip: content-box;
      cursor: pointer;
      overflow: hidden;
      display: none;
    }
    #progress.active { display: block; }
    #progressBar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }
    #status {
      margin-top: 12px; min-height: 22px; font-weight: 600;
      color: var(--accent);
    }
    /* Recently played: in-progress articles you can tap to resume. */
    #recent { margin-top: 10px; display: none; }
    #recent.active { display: block; }
    .recent-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; margin: 4px 0;
      border: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
      border-radius: 10px; cursor: pointer;
      transition: background .15s ease;
    }
    .recent-item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .recent-title {
      flex: 1; min-width: 0; font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .recent-meta { font-size: 12px; opacity: 0.65; white-space: nowrap; }
    .recent-remove {
      width: auto; margin: 0; padding: 2px 8px;
      background: transparent; border: none; font-size: 15px; opacity: 0.5;
    }
    .recent-remove:hover { opacity: 1; }
    /* Reading view: shows the article split into chunks, highlighting the one
       currently being spoken and auto-scrolling it into view. */
    #reader {
      margin-top: 16px;
      max-height: 44vh;
      overflow-y: auto;
      padding: 4px;
      border-radius: 12px;
      display: none;
      scrollbar-width: thin;
    }
    #reader.active { display: block; }
    .chunk {
      display: block;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 10px;
      border-left: 3px solid transparent;
      opacity: 0.55;
      cursor: pointer;
      transition: background .2s ease, opacity .2s ease;
    }
    .chunk:hover { opacity: 0.85; background: color-mix(in srgb, var(--accent) 8%, transparent); }
    /* Section titles get their own chunk (see chunkArticle) so they can read as
       headings instead of more body text. */
    .chunk.heading {
      font-size: 1.15em;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0.75;
      margin: 18px 0 2px;
      padding-bottom: 4px;
    }
    .chunk.heading:first-child { margin-top: 6px; }
    .chunk.heading.active { opacity: 1; }
    .chunk.active {
      opacity: 1;
      background: var(--accent-soft);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    /* Per-word highlight (browser engine where onboundary is supported). */
    .chunk .word-active {
      background: color-mix(in srgb, var(--accent) 38%, transparent);
      border-radius: 4px;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    /* Per-sentence highlight (premium engine, estimated from audio time). */
    .chunk .sentence-active {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: 4px;
    }
    #eta {
      margin-top: 6px;
      min-height: 16px;
      font-size: 13px;
      opacity: 0.7;
      text-align: right;
    }
    @media (max-width: 620px) {
      .row { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Article Reader</h1>
    <p class="intro">Paste an article URL. The page extracts the readable text and reads it aloud in a natural voice.</p>

    <label for="url">Article URL</label>
    <input id="url" type="url" placeholder="https://example.com/article" autocomplete="url" />

    <div id="recent" aria-label="Recently played"></div>

    <div class="row">
      <div>
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div>
        <label for="rate">Speed: <span id="rateValue">1.0</span>x</label>
        <div class="speed">
          <button type="button" id="rateDown" class="nudge" aria-label="Slower by 0.05" title="Slower (-0.05)">&minus;</button>
          <input id="rate" type="range" min="0.7" max="2" step="0.05" value="1" />
          <button type="button" id="rateUp" class="nudge" aria-label="Faster by 0.05" title="Faster (+0.05)">+</button>
        </div>
      </div>
    </div>

    <details class="premium" id="premiumSection" open>
      <summary>Premium voices</summary>
      <label class="check">
        <input type="checkbox" id="cfEnable" checked /> Use premium voice
      </label>
      <div class="row">
        <div>
          <label for="cfModel">Model</label>
          <select id="cfModel">
            <option value="melotts">MeloTTS — English (high volume)</option>
            <option value="aura-1">Aura-1 — natural voices</option>
            <option value="aura-2" selected>Aura-2 — best quality</option>
          </select>
        </div>
        <div>
          <label for="cfVoice">Voice</label>
          <select id="cfVoice" disabled></select>
        </div>
      </div>
      <label for="cfKey">Access key</label>
      <input id="cfKey" type="password" placeholder="Your access key" autocomplete="off" />
    </details>

    <label class="check standalone" title="Drop dates, bylines, share links, related-article lists and similar page furniture">
      <input type="checkbox" id="trimExtras" checked /> Trim article extras
    </label>

    <button class="primary" id="loadButton">Load and read</button>

    <div class="controls">
      <button id="restartButton" class="toggle" disabled aria-label="Restart from beginning" title="Restart from beginning">&#8634;</button>
      <button id="prevButton" class="toggle" disabled aria-label="Previous section" title="Previous section">&#9198;</button>
      <button id="prevSentenceButton" class="toggle" disabled aria-label="Previous sentence" title="Previous sentence">&#8249;</button>
      <button id="playPauseButton" class="toggle" disabled aria-label="Play">&#9654;</button>
      <button id="nextSentenceButton" class="toggle" disabled aria-label="Next sentence" title="Next sentence">&#8250;</button>
      <button id="nextButton" class="toggle" disabled aria-label="Next section" title="Next section">&#9197;</button>
    </div>

    <div id="progress" aria-label="Seek to a position in the article" title="Tap to seek"><div id="progressBar"></div></div>
    <div id="eta" aria-hidden="true"></div>

    <div id="status" aria-live="polite"></div>

    <div id="reader"></div>

    <details class="manual">
      <summary>Paste or edit text manually</summary>
      <label for="text">Article text</label>
      <textarea id="text" placeholder="Paste article text here, then press Read this text."></textarea>
      <button id="readTextButton">Read this text</button>
    </details>
  </main>

  <script>
    const urlInput = document.getElementById("url");
    const recentEl = document.getElementById("recent");
    const voiceSelect = document.getElementById("voice");
    const rateInput = document.getElementById("rate");
    const rateValue = document.getElementById("rateValue");
    const rateDown = document.getElementById("rateDown");
    const rateUp = document.getElementById("rateUp");
    const textArea = document.getElementById("text");
    const trimExtras = document.getElementById("trimExtras");
    const statusEl = document.getElementById("status");
    const readerEl = document.getElementById("reader");
    const progressEl = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");
    const etaEl = document.getElementById("eta");
    const loadButton = document.getElementById("loadButton");
    const readTextButton = document.getElementById("readTextButton");
    const restartButton = document.getElementById("restartButton");
    const prevButton = document.getElementById("prevButton");
    const prevSentenceButton = document.getElementById("prevSentenceButton");
    const nextSentenceButton = document.getElementById("nextSentenceButton");
    const playPauseButton = document.getElementById("playPauseButton");
    const nextButton = document.getElementById("nextButton");
    const cfEnable = document.getElementById("cfEnable");
    const cfModel = document.getElementById("cfModel");
    const cfVoice = document.getElementById("cfVoice");
    const cfKey = document.getElementById("cfKey");
    const premiumSection = document.getElementById("premiumSection");

    // Set this to your deployed Worker URL (see worker/README.md). Not secret —
    // the access key protects it.
    const CF_WORKER_URL = "https://article-reader-tts.article-reader.workers.dev";
    const CF_KEY_STORAGE = "cf_access_key";
    const PREFS_STORAGE = "ar_prefs";        // saved voice/speed/model choices
    // Bumped when stored premium prefs can't be trusted, in which case the
    // markup defaults win: v1 persisted quota-fallback degradations (pinning a
    // weaker tier, or the free voice, forever), and v2 stored the then-default
    // voice explicitly, which would override the new Random default.
    const PREFS_VERSION = 3;
    const POS_STORAGE = "ar_positions";      // per-URL resume positions
    const POS_TTL_MS = 7 * 24 * 60 * 60 * 1000;  // forget resume points after 7 days
    const AUDIO_CACHE_MAX = 40;              // in-memory premium-audio cache cap
    // Curated, narration-friendly US voices only (no Irish/British/heavy accents).
    const AURA_VOICES = [
      "asteria", "luna", "stella", "hera",   // female
      "orion", "arcas", "perseus", "zeus",   // male
    ];
    const AURA2_VOICES = [
      "luna", "asteria", "aurora", "hera",   // female
      "apollo", "orion", "orpheus", "zeus",  // male
    ];
    // The premium voice select's default entry: a real voice is drawn from the
    // active model's list per reading (see resolveCfVoice), so the Worker never
    // sees this sentinel — activeCfVoice is what gets sent.
    const RANDOM_VOICE = "random";
    let activeCfVoice = "";
    const CHUNK_SIZE = 400;      // both engines; also bounds premium first-audio latency
    const CHARS_PER_SEC = 15;    // rough TTS reading speed at rate 1.0, for ETA

    const PLAY_ICON = "▶";   // ▶
    const PAUSE_ICON = "⏸";  // ⏸
    let playbackState = "idle";   // "idle" | "playing" | "paused"
    let currentUtterance = null;  // browser engine guard
    // Two persistent elements for premium audio, alternating per chunk. Each is
    // created once and only ever re-`src`ed (never replaced with new Audio()),
    // so the user-activation from the first tap carries over to every later
    // chunk. Double-buffering is what keeps playback alive with the screen off:
    // the next chunk is fetched and loaded into the idle element *while* the
    // current one plays, so the handoff in `onended` is a synchronous play() on
    // an already-buffered element — no fetch, no load, nothing awaited in the
    // gap where the platform would otherwise suspend us.
    const cfPlayers = [createCfPlayer(), createCfPlayer()];
    let cfActive = 0;                 // index of the element currently playing
    const cfObjectUrls = [null, null];  // blob URL held by each element (to revoke)
    let cfPrepared = -1;              // chunk index preloaded into the idle element
    let cfPlayToken = 0;              // cloudflare async guard (discard stale fetches)

    function createCfPlayer() {
      const el = new Audio();
      el.preload = "auto";
      el.playsInline = true;
      // In the document (rather than detached) so the engine treats it as a
      // real media element for audio focus and background playback.
      document.body.appendChild(el);
      return el;
    }

    function cfAudio() { return cfPlayers[cfActive]; }

    // Declares long-form playback: on iOS this keeps audio running with the
    // screen off and ignores the ringer switch. Ignored where unsupported.
    try {
      if ("audioSession" in navigator) navigator.audioSession.type = "playback";
    } catch {}

    let voices = [];
    let chunks = [];
    let chunkKinds = [];          // per chunk: "heading" | "body" (see chunkArticle)
    let chunkIndex = 0;
    // Sentence-level position within the current chunk. chunkCharOffset is
    // where playback of this chunk started (0 = chunk start); lastBoundaryAbs
    // tracks the browser engine's spoken position via onboundary events.
    let chunkCharOffset = 0;
    let lastBoundaryAbs = 0;
    let sentenceStarts = [];      // per chunk: char offsets where sentences begin
    let chunkEls = [];            // rendered chunk elements in the reading view
    let currentUrl = "";          // article URL for resume tracking ("" = pasted text)
    let rawArticle = "";          // last extraction, re-cleaned when trimming is toggled
    let articleTitle = "Article"; // for the lock-screen / media metadata
    const audioCache = new Map(); // key `${model}|${voice}|${text}` -> Blob (session only)

    // Per-word highlighting state (browser engine, where onboundary fires).
    let currentWordSpans = [];    // [{ start, end, el }] for the active chunk
    let wordSpanIndex = -1;       // which chunk currently has word spans

    // Per-sentence highlighting state (premium engine, no boundary events —
    // the position is estimated from audio time, so sentence granularity).
    let currentSentenceSpans = [];  // [{ el }] per sentence of the active chunk
    let sentenceSpanIndex = -1;     // which chunk currently has sentence spans
    let speechTickTimer = null;     // browser-engine fallback highlight timer

    function activeEngine() {
      return cfEnable.checked ? "cloudflare" : "browser";
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    // --- Persistence (preferences + resume position) -----------------------
    // localStorage has no built-in expiry, so prefs persist indefinitely.
    // Resume positions carry a timestamp and are pruned after POS_TTL_MS.

    function loadJson(key) {
      try { return JSON.parse(localStorage.getItem(key)) || {}; }
      catch { return {}; }
    }

    // The premium tier the user *chose*, kept separate from what is currently
    // active: quotaFallback() degrades the live model (or drops to the free
    // voice) mid-article, and that must neither be persisted nor carried into
    // the next article. restorePreferredCf() puts the choice back.
    let preferredCf = null;

    function snapshotCfPrefs() {
      preferredCf = { enable: cfEnable.checked, model: cfModel.value, voice: cfVoice.value };
    }

    function restorePreferredCf() {
      if (!preferredCf) return;
      cfEnable.checked = preferredCf.enable;
      cfModel.value = preferredCf.model;
      syncCfModelUi();  // repopulates the voice list for the restored model
      if (preferredCf.voice) cfVoice.value = preferredCf.voice;
      resolveCfVoice();  // after the select is back to the chosen value
    }

    function savePrefs() {
      // Persist the chosen tier, never a degraded one (see preferredCf).
      const cf = preferredCf ||
        { enable: cfEnable.checked, model: cfModel.value, voice: cfVoice.value };
      localStorage.setItem(PREFS_STORAGE, JSON.stringify({
        v: PREFS_VERSION,
        voice: voiceSelect.selectedOptions[0]?.textContent || "",
        rate: rateInput.value,
        cfEnable: cf.enable,
        cfModel: cf.model,
        cfVoice: cf.voice,
        trim: trimExtras.checked,
      }));
    }

    function savePosition() {
      if (!currentUrl || !chunks.length) return;
      const all = loadJson(POS_STORAGE);
      all[currentUrl] = { index: chunkIndex, total: chunks.length, t: Date.now(), title: articleTitle };
      // Prune entries older than the TTL so the store can't grow forever.
      const now = Date.now();
      for (const k of Object.keys(all)) {
        if (now - (all[k].t || 0) > POS_TTL_MS) delete all[k];
      }
      localStorage.setItem(POS_STORAGE, JSON.stringify(all));
    }

    function getPosition(url) {
      const p = loadJson(POS_STORAGE)[url];
      if (!p || Date.now() - (p.t || 0) > POS_TTL_MS) return null;
      return p;
    }

    function clearPosition() {
      if (!currentUrl) return;
      const all = loadJson(POS_STORAGE);
      delete all[currentUrl];
      localStorage.setItem(POS_STORAGE, JSON.stringify(all));
    }

    // --- Recently played ----------------------------------------------------
    // In-progress articles (saved position, not yet finished), tap to resume.
    // Rendered while idle so items don't move around under the user's finger.

    function timeAgo(t) {
      const s = Math.round((Date.now() - t) / 1000);
      if (s < 90) return "just now";
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      return `${Math.round(s / 86400)} d ago`;
    }

    function removePosition(url) {
      const all = loadJson(POS_STORAGE);
      delete all[url];
      localStorage.setItem(POS_STORAGE, JSON.stringify(all));
    }

    function renderRecent() {
      const now = Date.now();
      const items = Object.entries(loadJson(POS_STORAGE))
        .filter(([, p]) => now - (p.t || 0) <= POS_TTL_MS)
        .sort((a, b) => b[1].t - a[1].t)
        .slice(0, 5);
      recentEl.innerHTML = "";
      recentEl.classList.toggle("active", items.length > 0);
      for (const [url, p] of items) {
        const item = document.createElement("div");
        item.className = "recent-item";
        const title = document.createElement("span");
        title.className = "recent-title";
        title.textContent = p.title || titleFromUrl(url);
        const meta = document.createElement("span");
        meta.className = "recent-meta";
        const pct = p.total ? Math.round(((p.index + 1) / p.total) * 100) : 0;
        meta.textContent = `${pct}% · ${timeAgo(p.t || now)}`;
        const remove = document.createElement("button");
        remove.className = "recent-remove";
        remove.textContent = "✕";
        remove.setAttribute("aria-label", `Remove "${title.textContent}" from the list`);
        remove.addEventListener("click", (e) => {
          e.stopPropagation();
          removePosition(url);
          renderRecent();
        });
        item.append(title, meta, remove);
        item.addEventListener("click", () => {
          urlInput.value = url;
          loadArticle();
        });
        recentEl.appendChild(item);
      }
    }

    // --- Premium audio cache (in-memory, this page session only) -----------

    function cfCacheKey(text) {
      return `${cfModel.value}|${activeCfVoice}|${text}`;
    }

    function cacheAudio(key, blob) {
      audioCache.set(key, blob);
      // Simple FIFO eviction once we exceed the cap.
      while (audioCache.size > AUDIO_CACHE_MAX) {
        audioCache.delete(audioCache.keys().next().value);
      }
    }

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = "";

      // Voices to hide: macOS/Windows novelty/robotic voices, plus a few
      // natural ones the user opted out of (Tessa, Rishi).
      const noveltyVoices = new Set([
        "Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos",
        "Eddy", "Flo", "Fred", "Good News", "Grandma", "Grandpa", "Jester",
        "Junior", "Kathy", "Organ", "Ralph", "Reed", "Rishi", "Rocko",
        "Sandy", "Shelley", "Superstar", "Tessa", "Trinoids", "Whisper",
        "Wobble", "Zarvox"
      ]);

      // Only neutral English accents — keep US and UK, drop Irish (en-IE),
      // Australian (en-AU), Indian (en-IN), South African (en-ZA), etc.
      const allowedLocales = new Set(["en-us", "en-gb"]);

      const englishVoices = voices.filter(v => {
        const locale = v.lang.toLowerCase().replace("_", "-");
        if (!allowedLocales.has(locale)) return false;
        const baseName = v.name.split(" (")[0].trim();
        return !noveltyVoices.has(baseName);
      });

      englishVoices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = voices.indexOf(voice);
        option.textContent = `${voice.name} (${voice.lang})`;
        if (index === 0) option.selected = true;
        voiceSelect.appendChild(option);
      });

      // Restore the previously chosen voice, if it's still available.
      const savedVoice = loadJson(PREFS_STORAGE).voice;
      if (savedVoice) {
        const opt = [...voiceSelect.options].find(o => o.textContent === savedVoice);
        if (opt) voiceSelect.value = opt.value;
      }
    }

    function cleanArticle(raw, title = "") {
      // Defensive markdown/preamble stripping (text mode removes most of this,
      // but Jina sometimes still returns markdown or a Title: preamble).
      const stripped = raw
        .replace(/^Title:.*$/gmi, "")
        .replace(/^URL Source:.*$/gmi, "")
        .replace(/^Published Time:.*$/gmi, "")
        .replace(/^Markdown Content:.*$/gmi, "")
        .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
        .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
        .replace(/^#{1,6}\s+/gm, "")    // markdown heading markers (not "C#"/"#1")
        .replace(/\*\*|__/g, "");
      const normalized = expandForSpeech(normalizeForSpeech(stripped));
      // Jina text mode puts each paragraph/heading on its own line. Keep those
      // line breaks (chunkArticle uses them for structure) and append a period
      // to prose lines lacking terminal punctuation (mostly list items) so the
      // voice pauses instead of running them into the next line. Headings need
      // no period: they become their own chunk, so a pause follows anyway.
      let lines = normalized
        .split(/\r?\n/)
        .map(l => l.replace(/\s+/g, " ").trim())
        .filter(Boolean);
      // Page furniture (dates, bylines, share links, related lists) — opt-out
      // via the "Trim article extras" checkbox. Runs before the period pass so
      // the patterns see the line exactly as the page wrote it.
      if (trimExtras.checked) lines = stripBoilerplate(lines, title);
      return lines
        .map(l => isHeadingLine(l) || /[.!?…:;)\]"'’”]$/.test(l) ? l : l + ".")
        .join("\n")
        .trim();
    }

    // --- Boilerplate trimming ------------------------------------------------
    // Everything here matches WHOLE lines: Jina's text mode puts each block on
    // its own line, so "Share" alone is a share button while "Share prices
    // fell..." is prose. Deliberately no LLM call — the signal is a line's
    // shape and position, which is cheap, offline, and debuggable. Patterns are
    // scoped to a zone (head / tail / anywhere) so a date in the article body
    // survives even though the dateline under the headline does not.

    // Junk lines, dropped wherever they appear. Full-line matches only.
    const JUNK_EXACT_RE = [
      /^(?:advertisement|advertisements|sponsored(?: content)?|promoted(?: content)?)$/i,
      /^listen(?: to this article)?$/i,
      /^\d+\s*(?:min(?:ute)?s?|hours?)\s*(?:read|listen)$/i,
      /^reading time\b.*$/i,
      /^\d[\d,.]*\s*[km]?\s*(?:comments?|views?|shares?|likes?|reads?)$/i,
      /^(?:getty images|reuters|associated press|ap photo|afp|shutterstock|unsplash|istock)\.?$/i,
      /^we use cookies\b.*$/i,
      /^(?:accept(?: all)?(?: cookies)?|reject all|manage (?:cookies|preferences)|cookie settings)$/i,
      /^(?:\d+\s+)+(?:next|previous|»)?$/i,     // pagination strips: "1 2 3 Next"
      /^@[\w.]+$/,                              // a bare social handle
    ];

    // Junk lines that start with an innocent word, so they're only trusted when
    // the line is short and unpunctuated — i.e. a button label, not a sentence.
    const JUNK_SHORT_RE = [
      /^share\b/i, /^copy (?:link|the link)\b/i, /^gift (?:this )?article\b/i,
      /^(?:save|print|email|text|tweet|post|pin) (?:this|article|story)?\b/i,
      /^(?:follow|connect with) (?:us|me|the author)\b/i,
      /^(?:sign up|subscribe|get (?:our )?newsletter|enter your email|join .* newsletter)\b/i,
      /^(?:photos?|photographs?|images?|illustrations?|credits?|captions?)\s*[:—–-]/i,
      /^(?:leave|post) a comment\b/i, /^sign in to comment\b/i,
    ];

    // Head-zone patterns: datelines, bylines and section kickers.
    const MONTHS = "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
    const HEAD_RE = [
      /^(?:published|posted|updated|last updated|first published|revised)\b.*$/i,
      new RegExp(`^(?:${MONTHS})\\s+\\d{1,2},?\\s*\\d{0,4}$`, "i"),
      new RegExp(`^\\d{1,2}\\s+(?:${MONTHS})\\.?,?\\s*\\d{0,4}$`, "i"),
      /^\d{4}-\d{2}-\d{2}\b.*$/,
      /^\d{1,2}\/\d{1,2}\/\d{2,4}$/,
      /^\d{1,2}:\d{2}\s*(?:[ap]\.?m\.?)?(?:\s+[A-Z]{2,4})?\b.*$/i,   // "3:14 PM EDT ..."
      // "By Jane Doe and Sam Ray" — case-sensitive on the name so a sentence
      // starting "by the time..." is not mistaken for a byline.
      /^(?:By|BY|by)\s+[A-Z][\w.'’-]+(?:\s+(?:and\s+)?[A-Z][\w.'’-]+){0,4}$/,
      /^(?:words|reported|written|photographs?|edited|illustrated)\s+by\b.*$/i,
      /^(?:opinion|analysis|commentary|editorial|newsletter|exclusive|feature|interview|review|guest post|op-ed)$/i,
    ];

    // Tail-zone markers. From the first one onwards, nothing is article text.
    const TAIL_CUT_RE = [
      /^(?:related|related (?:articles|stories|reading|posts|content)|more (?:from|on|stories|like this)|read (?:more|next)|you (?:might|may) also like|recommended(?: for you)?|most (?:popular|read)|up next|see also|further reading)\b.*$/i,
      /^(?:tags?|topics?|filed under|categor(?:y|ies)|keywords)\s*:?.*$/i,
      /^(?:©|copyright)\b.*$/i,
      /^all rights reserved\b.*$/i,
      /^(?:terms of (?:service|use)|privacy policy|cookie policy|contact us|about us|advertise|newsletters?)$/i,
      /^(?:comments?|discussion|join the conversation)$/i,
      /^this (?:article|story|post) (?:was|first) (?:originally )?(?:published|appeared)\b.*$/i,
      /^(?:support our journalism|become a member|already a subscriber)\b.*$/i,
      // Author bio: "Jane Doe is a reporter covering X for Y."
      /^[A-Z][\w.'’-]+(?:\s+[A-Z][\w.'’-]+){1,3}\s+is\s+(?:an?|the)\s+.{0,80}$/,
    ];

    function isJunkLine(line) {
      if (JUNK_EXACT_RE.some(re => re.test(line))) return true;
      const buttonish = line.length <= 48 && !/[.!?]$/.test(line);
      return buttonish && JUNK_SHORT_RE.some(re => re.test(line));
    }

    // How boilerplate-ish a head-zone line looks. Scored rather than matched
    // outright so shape (short, title-cased, carries a year, no verb) can catch
    // datelines and kickers the patterns above don't spell out.
    function headScore(line, afterDropped) {
      let score = 0;
      if (HEAD_RE.some(re => re.test(line))) score += 3;
      if (line.length < 60 && !/[.!?]$/.test(line)) score += 1;
      if (/\b(?:19|20)\d{2}\b/.test(line) && line.length <= 40) score += 1;
      if (line.length <= 40 && line === line.toUpperCase() && /[A-Z]/.test(line)) score += 1;
      if (afterDropped) score += 1;                      // boilerplate arrives in clusters
      if (/\b(?:said|says|is|are|was|were|has|have|will|would|can|could|the)\b/i.test(line)) score -= 2;
      if (line.length > 120) score -= 3;
      return score;
    }

    // Drop the pre-article furniture and cut the post-article furniture.
    function stripBoilerplate(lines, title = "") {
      const dropped = [];
      // The head zone ends at the first real prose paragraph: long, and ending
      // in a sentence. Everything before that is headline/dateline/byline land.
      const firstProse = lines.findIndex(l => l.length > 180 && /[.!?…"'’”]$/.test(l));
      const headEnd = Math.min(firstProse === -1 ? 6 : firstProse, 8);
      const norm = (s) => s.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
      const titleNorm = norm(title);

      let kept = [];
      let lastDropped = false;
      lines.forEach((line, i) => {
        const inHead = i < headEnd;
        // The headline usually repeats the <title>; we already show it above.
        const dupTitle = inHead && titleNorm && norm(line) === titleNorm;
        const drop = isJunkLine(line) || dupTitle ||
          (inHead && headScore(line, lastDropped) >= 3);
        lastDropped = drop;
        if (drop) dropped.push(line); else kept.push(line);
      });

      // Tail: cut from the first marker in the closing stretch of the article.
      // The guard is character-based, not line-based — the cut only stands if
      // most of the article's text is still above it, so a mid-article
      // "Read more" link box can't take the second half with it.
      const totalChars = kept.reduce((n, l) => n + l.length, 0);
      let charsAbove = 0;
      const tailStart = Math.max(1, kept.length - 15);
      for (let i = 0; i < kept.length; i++) {
        // A cut marker is a label or a link line, never a full paragraph — the
        // length cap is what keeps prose like "Related work continues at..."
        // from ending the article.
        if (i >= tailStart && kept[i].length <= 120 &&
            TAIL_CUT_RE.some(re => re.test(kept[i])) &&
            charsAbove >= totalChars * 0.6) {
          dropped.push(...kept.slice(i));
          kept = kept.slice(0, i);
          break;
        }
        charsAbove += kept[i].length;
      }

      // Auditable: every drop is visible in the console, so a bad pattern can be
      // spotted without guessing.
      if (dropped.length) console.debug("[article-reader] trimmed extras:", dropped);
      return kept;
    }

    // A line that reads like a section title rather than prose. Jina's text
    // mode drops the markdown "#", so shape is all we have: short, few words,
    // not a list item or blockquote, and no terminal punctuation — except "?"
    // and "!", which standalone lines this short are almost always titles
    // ("What About Costs?"). A period is excluded: too many one-line
    // paragraphs would be mistaken for headings.
    function isHeadingLine(line) {
      const l = line.trim();
      if (!l || l.length > 90) return false;
      if (/[.…,;:)\]"'’”]$/.test(l)) return false;         // prose, or a lead-in line
      if (/^(?:[-*•‣–—>]|\d+[.)])\s/.test(l)) return false;  // list item / quote
      return l.split(/\s+/).length <= 12;
    }

    // Remove leftover bits that get read aloud awkwardly: reference markers,
    // editorial notes, and navigation remnants.
    function normalizeForSpeech(text) {
      return text
        // Leaked web-component <style> CSS (e.g. X/Twitter shadow DOM counters).
        // Only strip rule-runs that contain CSS-only tokens (":host", minified
        // declarations) so code blocks and JSON are left untouched.
        .replace(/(?:[^{}\n]*\{[^{}]*\})+/g, m =>
          /:host|white-space:|will-change:|display:inline-|line-height:|--[\w-]+:/.test(m) ? "" : m)
        .replace(/\b(?:Jump|Skip) to (?:main )?(?:content|navigation|search)\b/gi, "")
        // Standalone ad/label lines (not the word mid-sentence).
        .replace(/^[ \t]*(?:advertisement|sponsored(?: content)?|promoted content)[ \t]*$/gim, "")
        .replace(/\[\d+\](?:\[\d+\])*/g, "")  // [12] or [12][13] reference marks
        .replace(/\[[^\]]*\b(?:citation|edit|when|update|clarif\w*|source|verification|dead link|page needed|according to whom|by whom|vague|note)\b[^\]]*\]/gi, "")
        .replace(/\[(?:\?|…|\.\.\.)\]/g, "");
    }

    // Expand symbols, currencies, and common abbreviations into words so the
    // voice says them naturally ("50%" -> "50 percent") instead of spelling
    // them out or mispronouncing them. Conservative to avoid wrong guesses.
    function expandForSpeech(text) {
      return text
        // strip emoji / pictographs / arrows (read aloud as "smiling face" etc.)
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu, "")
        // common Latin abbreviations (also drops the period that breaks pauses)
        .replace(/\be\.g\.\s*/gi, "for example ")
        .replace(/\bi\.e\.\s*/gi, "that is ")
        .replace(/\betc\b\.?/gi, "et cetera")
        .replace(/\bvs\b\.?/gi, "versus")
        // currency: scale-word form first, then plain amounts
        .replace(/\$\s?(\d[\d,]*(?:\.\d+)?)\s+(trillion|billion|million|thousand)\b/gi, "$1 $2 dollars")
        .replace(/\$\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 dollars")
        .replace(/€\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 euros")
        .replace(/£\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 pounds")
        // percent
        .replace(/(\d)\s*%/g, "$1 percent")
        // ampersand
        .replace(/\s*&\s*/g, " and ")
        // numeric ranges (en/em dash, or spaced hyphen) -> "to"; leaves ISO
        // dates like 2025-08-27 untouched (plain hyphen, no spaces)
        .replace(/(\d)\s*[–—]\s*(\d)/g, "$1 to $2")
        .replace(/(\d)\s+-\s+(\d)/g, "$1 to $2")
        // "#5" -> "number 5" (leaves "C#" alone)
        .replace(/#(\d)/g, "number $1")
        // degrees
        .replace(/°\s?([CF])\b/g, " degrees $1")
        .replace(/°/g, " degrees ")
        // collapse repeated terminal punctuation ("!!!" -> "!")
        .replace(/([!?])\1+/g, "$1");
    }

    // Build a readable title from a URL slug when Jina gives no Title: line.
    function titleFromUrl(u) {
      try {
        const path = new URL(u).pathname.split("/").filter(Boolean).pop() || "";
        const slug = decodeURIComponent(path)
          .replace(/\.[a-z0-9]+$/i, "")
          .replace(/[-_]+/g, " ")
          .trim();
        return slug ? slug.replace(/\b\w/g, c => c.toUpperCase()) : "Article";
      } catch { return "Article"; }
    }

    function splitText(text, maxLen) {
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      const result = [];
      let current = "";

      for (const sentence of sentences) {
        if ((current + sentence).length > maxLen) {
          if (current) result.push(current.trim());
          current = sentence;
        } else {
          current += " " + sentence;
        }
      }

      if (current.trim()) result.push(current.trim());
      return result;
    }

    // Chunk the article without letting a chunk straddle a heading: each
    // heading line becomes a chunk of its own (so the reading view can style
    // it, and both engines pause after it), and the prose in between is filled
    // to maxLen exactly as before. Records the kind of each chunk in
    // chunkKinds, which renderChunks() turns into styling.
    function chunkArticle(text, maxLen) {
      const result = [];
      const kinds = [];
      let prose = [];
      const flushProse = () => {
        if (!prose.length) return;
        for (const c of splitText(prose.join(" "), maxLen)) { result.push(c); kinds.push("body"); }
        prose = [];
      };
      for (const line of text.split("\n").map(l => l.trim()).filter(Boolean)) {
        if (isHeadingLine(line)) {
          flushProse();
          result.push(line);
          kinds.push("heading");
        } else {
          prose.push(line);
        }
      }
      flushProse();
      chunkKinds = kinds;
      return result;
    }

    function selectedVoice() {
      return voices[Number(voiceSelect.value)] || null;
    }

    // --- Sentence-level navigation ------------------------------------------

    // Record where each sentence begins inside each chunk (same sentence
    // regex as splitText, so boundaries agree).
    function computeSentenceStarts() {
      sentenceStarts = chunks.map(text => {
        const re = /[^.!?]+[.!?]+|[^.!?]+$/g;
        const starts = [];
        let m;
        while ((m = re.exec(text))) {
          const lead = m[0].match(/^\s*/)[0].length;  // skip leading whitespace
          starts.push(m.index + lead);
        }
        return starts.length ? starts : [0];
      });
    }

    // Best estimate of the spoken position (char offset) in the current chunk.
    function currentCharPos() {
      if (activeEngine() === "cloudflare") {
        // TTS speed is roughly constant, so time maps linearly to characters.
        const el = cfAudio();
        const d = el.duration;
        if (isFinite(d) && d > 0) {
          return Math.floor((el.currentTime / d) * chunks[chunkIndex].length);
        }
        return chunkCharOffset;
      }
      return lastBoundaryAbs;
    }

    function sentenceIndexAt(chunkI, pos) {
      const starts = sentenceStarts[chunkI] || [0];
      let si = 0;
      for (let i = 0; i < starts.length; i++) if (starts[i] <= pos) si = i;
      return si;
    }

    function stepSentence(delta) {
      if (playbackState === "idle" || !chunks.length) return;
      const starts = sentenceStarts[chunkIndex] || [0];
      const target = sentenceIndexAt(chunkIndex, currentCharPos()) + delta;
      if (target < 0) {
        // Cross back into the previous chunk's last sentence.
        if (chunkIndex > 0) {
          const prev = sentenceStarts[chunkIndex - 1] || [0];
          playFrom(chunkIndex - 1, prev[prev.length - 1]);
        } else {
          playFrom(0, 0);
        }
      } else if (target >= starts.length) {
        if (chunkIndex < chunks.length - 1) playFrom(chunkIndex + 1, 0);
      } else {
        playFrom(chunkIndex, starts[target]);
      }
    }

    // Char offset of a click inside a chunk element, so a tap on any sentence
    // in the reading view can start playback there. Works whether the chunk
    // holds plain text or per-word spans (their text nodes concatenate to the
    // full chunk text). Falls back to 0 (chunk start).
    function charOffsetFromPoint(el, x, y) {
      let node = null, offset = 0;
      if (document.caretRangeFromPoint) {
        const r = document.caretRangeFromPoint(x, y);
        if (r) { node = r.startContainer; offset = r.startOffset; }
      } else if (document.caretPositionFromPoint) {
        const p = document.caretPositionFromPoint(x, y);
        if (p) { node = p.offsetNode; offset = p.offset; }
      }
      if (!node || !el.contains(node)) return 0;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let total = 0;
      while (walker.nextNode()) {
        if (walker.currentNode === node) return total + offset;
        total += walker.currentNode.textContent.length;
      }
      return 0;
    }

    // Single play/pause toggle, driven by real playback state:
    //   idle    -> disabled, shows ▶
    //   playing -> enabled,  shows ⏸ (click to pause)
    //   paused  -> enabled,  shows ▶ (click to resume)
    function setControls(state) {
      playbackState = state;
      playPauseButton.disabled = state === "idle";
      const playing = state === "playing";
      playPauseButton.textContent = playing ? PAUSE_ICON : PLAY_ICON;
      playPauseButton.setAttribute(
        "aria-label",
        playing ? "Pause" : state === "paused" ? "Resume" : "Play"
      );
      updateNav();
      updateMediaSession();
      syncWakeLock();
      if (state === "idle") renderRecent();
    }

    function updateNav() {
      // Prev/Next available whenever something is loaded (playing or paused).
      // Prev stays enabled on the first section — it restarts the section.
      prevButton.disabled = playbackState === "idle";
      nextButton.disabled = playbackState === "idle" || chunkIndex >= chunks.length - 1;
      restartButton.disabled = playbackState === "idle";
      prevSentenceButton.disabled = playbackState === "idle";
      nextSentenceButton.disabled = playbackState === "idle";
    }

    // Render the article into the reading view, one clickable block per chunk.
    function renderChunks() {
      readerEl.innerHTML = "";
      chunkEls = chunks.map((text, i) => {
        const el = document.createElement("span");
        el.className = chunkKinds[i] === "heading" ? "chunk heading" : "chunk";
        el.textContent = text;
        el.addEventListener("click", (e) => {
          // Start from the tapped sentence, not just the chunk.
          const pos = charOffsetFromPoint(el, e.clientX, e.clientY);
          const starts = sentenceStarts[i] || [0];
          playFrom(i, starts[sentenceIndexAt(i, pos)]);
        });
        readerEl.appendChild(el);
        return el;
      });
      readerEl.classList.toggle("active", chunks.length > 0);
      progressEl.classList.toggle("active", chunks.length > 0);
      updateProgress();
    }

    function updateProgress() {
      const pct = chunks.length ? ((chunkIndex + 1) / chunks.length) * 100 : 0;
      progressBar.style.width = pct + "%";
      updateEta();
    }

    // Rough estimate of time left, based on characters remaining and speed.
    function updateEta() {
      if (!chunks.length || playbackState === "idle") { etaEl.textContent = ""; return; }
      let remaining = 0;
      for (let i = chunkIndex; i < chunks.length; i++) remaining += chunks[i].length;
      const rate = Number(rateInput.value) || 1;
      const secs = remaining / (CHARS_PER_SEC * rate);
      etaEl.textContent = secs >= 90
        ? `~${Math.round(secs / 60)} min left`
        : `~${Math.max(1, Math.round(secs))} sec left`;
    }

    // --- Per-word highlighting (browser engine) ----------------------------

    // Restore the word/sentence-spanned chunk back to plain text.
    function clearWordSpans() {
      if (wordSpanIndex >= 0 && chunkEls[wordSpanIndex]) {
        chunkEls[wordSpanIndex].textContent = chunks[wordSpanIndex];
      }
      currentWordSpans = [];
      wordSpanIndex = -1;
      if (sentenceSpanIndex >= 0 && chunkEls[sentenceSpanIndex]) {
        chunkEls[sentenceSpanIndex].textContent = chunks[sentenceSpanIndex];
      }
      currentSentenceSpans = [];
      sentenceSpanIndex = -1;
    }

    // Split the active chunk into one span per sentence (their text nodes
    // still concatenate to the full chunk text, so tap-to-sentence keeps
    // working). The first segment starts at 0 to cover any leading space.
    function buildSentenceSpans(index) {
      const el = chunkEls[index];
      if (!el) return;
      const text = chunks[index];
      const starts = sentenceStarts[index] || [0];
      el.textContent = "";
      currentSentenceSpans = starts.map((s, j) => {
        const from = j === 0 ? 0 : s;
        const to = j + 1 < starts.length ? starts[j + 1] : text.length;
        const span = document.createElement("span");
        span.textContent = text.slice(from, to);
        el.appendChild(span);
        return { el: span };
      });
      sentenceSpanIndex = index;
      // The word spans (if any) were just replaced by the sentence spans.
      if (wordSpanIndex === index) { currentWordSpans = []; wordSpanIndex = -1; }
    }

    // Some browser voices never fire onboundary (Android Chrome's network
    // voices, iOS Safari). After a short grace period with no boundary events,
    // fall back to time-estimated sentence highlighting, like the premium
    // engine. The estimate also feeds lastBoundaryAbs so sentence prev/next
    // stays roughly in sync.
    const SPEECH_CHARS_PER_SEC = 15;  // ~180 wpm at rate 1
    function startSpeechTick(utterance, startOffset, hasBoundary) {
      clearInterval(speechTickTimer);
      let lastTick = Date.now();
      let played = 0;  // ms actually speaking (excludes paused time)
      speechTickTimer = setInterval(() => {
        if (utterance !== currentUtterance || hasBoundary()) {
          clearInterval(speechTickTimer);
          return;
        }
        const now = Date.now();
        if (!speechSynthesis.paused) played += now - lastTick;
        lastTick = now;
        if (played < 1500) return;  // grace: real boundary events start immediately
        if (sentenceSpanIndex !== chunkIndex) buildSentenceSpans(chunkIndex);
        const pos = Math.min(
          startOffset + (played / 1000) * SPEECH_CHARS_PER_SEC * Number(rateInput.value),
          chunks[chunkIndex].length - 1);
        lastBoundaryAbs = pos;
        const si = sentenceIndexAt(chunkIndex, pos);
        currentSentenceSpans.forEach((s, j) => s.el.classList.toggle("sentence-active", j === si));
      }, 300);
    }

    // Split the active chunk into word spans so onboundary can highlight one.
    function buildWordSpans(index) {
      const el = chunkEls[index];
      if (!el) return;
      const text = chunks[index];
      el.textContent = "";
      const spans = [];
      const re = /\S+/g;
      let m, last = 0;
      while ((m = re.exec(text))) {
        if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = m[0];
        el.appendChild(span);
        spans.push({ start: m.index, end: m.index + m[0].length, el: span });
        last = m.index + m[0].length;
      }
      if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
      currentWordSpans = spans;
      wordSpanIndex = index;
      if (sentenceSpanIndex === index) { currentSentenceSpans = []; sentenceSpanIndex = -1; }
    }

    function highlightWordAt(charIndex) {
      const w = currentWordSpans.find(s => charIndex >= s.start && charIndex < s.end);
      if (!w) return;
      currentWordSpans.forEach(s => s.el.classList.toggle("word-active", s === w));
    }

    // Highlight the chunk being spoken, scroll it into view, track progress,
    // and remember the position so the article can resume later.
    function highlightChunk(i) {
      clearWordSpans();
      chunkEls.forEach((el, idx) => el.classList.toggle("active", idx === i));
      const el = chunkEls[i];
      if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      updateProgress();
      savePosition();
      updateMediaSession();
    }

    function speakChunks() {
      if (chunkIndex >= chunks.length) {
        clearInterval(speechTickTimer);
        setStatus("Finished reading.");
        setControls("idle");
        updateNav();
        clearPosition();
        return;
      }

      // Speak from the sentence offset (0 = whole chunk). Highlighting maps
      // the utterance's relative charIndex back to absolute chunk positions.
      const startOffset = chunkCharOffset;
      const utterance = new SpeechSynthesisUtterance(chunks[chunkIndex].slice(startOffset));
      utterance.voice = selectedVoice();
      utterance.rate = Number(rateInput.value);
      utterance.pitch = 1;
      utterance.volume = 1;

      // Keep the controls in sync with what the speech engine actually does.
      utterance.onstart = () => {
        lastBoundaryAbs = startOffset;
        setControls("playing");
        updateNav();
        startSpeechTick(utterance, startOffset, () => boundaryFired);
      };
      utterance.onpause = () => setControls("paused");
      utterance.onresume = () => setControls("playing");

      // Word-level highlight where supported; voices with no boundary events
      // get the time-estimated sentence fallback from startSpeechTick instead.
      let boundaryFired = false;
      utterance.onboundary = (event) => {
        if (utterance !== currentUtterance) return;
        if (event.name && event.name !== "word") return;
        boundaryFired = true;
        // If the fallback already swapped in sentence spans, restore word spans.
        if (sentenceSpanIndex === chunkIndex) buildWordSpans(chunkIndex);
        lastBoundaryAbs = startOffset + event.charIndex;
        highlightWordAt(startOffset + event.charIndex);
      };

      utterance.onend = () => {
        // Ignore the end event of an utterance we've already replaced (e.g. via
        // prev/next or a re-read) so navigation can't double-advance the index.
        if (utterance !== currentUtterance) return;
        chunkCharOffset = 0;
        chunkIndex += 1;
        speakChunks();
      };

      utterance.onerror = (event) => {
        // "interrupted"/"canceled" fire on a deliberate skip or re-read; not errors.
        if (event.error === "interrupted" || event.error === "canceled") return;
        if (utterance !== currentUtterance) return;
        // Autoplay blocked (e.g. article shared in with no user gesture yet):
        // keep everything loaded and wait for a tap on play.
        if (event.error === "not-allowed") {
          setControls("paused");
          setStatus("Tap ▶ to start listening.");
          return;
        }
        setStatus("Speech playback failed. Try another voice.");
        setControls("idle");
      };

      currentUtterance = utterance;
      highlightChunk(chunkIndex);
      buildWordSpans(chunkIndex);  // no-op visually until onboundary fires
      setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
      speechSynthesis.speak(utterance);
    }

    // --- Cloudflare engine -------------------------------------------------

    async function fetchCfAudio(text) {
      // Reuse already-generated audio (saves latency and daily quota).
      const cacheKey = cfCacheKey(text);
      if (audioCache.has(cacheKey)) return audioCache.get(cacheKey);

      const key = cfKey.value.trim();
      if (!key) { const e = new Error("no-key"); e.code = "no-key"; throw e; }
      let res;
      try {
        res = await fetch(CF_WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Access-Key": key },
          body: JSON.stringify({
            model: cfModel.value,
            voice: activeCfVoice,
            text,
            lang: "en",
          }),
        });
      } catch {
        const e = new Error("network"); e.code = "network"; throw e;
      }
      if (res.status === 401) { const e = new Error("unauthorized"); e.code = "unauthorized"; throw e; }
      if (!res.ok) {
        // The Worker reports why: { error, detail }, with 429 for quota.
        let body = null;
        try { body = await res.json(); } catch {}
        const detail = (body && body.detail) || (body && body.error) || "";
        const quota = res.status === 429 || /quota|capacity|neurons|rate.?limit|exceeded/i.test(detail);
        const e = new Error("server");
        e.code = quota ? "quota" : "server";
        e.detail = detail;
        e.status = res.status;
        throw e;
      }
      const blob = await res.blob();
      cacheAudio(cacheKey, blob);
      return blob;
    }

    function handleCfError(error) {
      if (error.code === "no-key") {
        setStatus("Enter your premium access key, or untick “Use premium voice”.");
        premiumSection.open = true;  // the key field is inside a collapsed <details>
        cfKey.focus();
      } else if (error.code === "unauthorized") {
        setStatus("Access key rejected — check your key.");
        premiumSection.open = true;
      } else if (error.code === "quota") {
        setStatus("Premium voice failed: daily Workers AI quota reached. It resets at midnight UTC — until then, use a built-in voice.");
      } else if (error.code === "network") {
        setStatus("Premium voice failed: network error. Check your connection and retry.");
      } else {
        const why = error.detail ? `: ${error.detail}` : (error.status ? ` (HTTP ${error.status})` : "");
        setStatus(`Premium voice failed${why}. Retry, or use a built-in voice.`);
      }
      setControls("idle");
    }

    // When Workers AI quota/capacity runs out mid-article, degrade through
    // the premium tiers (Aura-2 -> Aura-1 -> MeloTTS) and finally to the
    // free browser voice, keeping the listening position. The degraded tier is
    // deliberately not saved (see preferredCf): the daily quota resets, so the
    // next article starts over at the most capable voice. The short delay
    // lets the user read the status message; the token guard drops the
    // retry if they navigate or stop in the meantime.
    function quotaFallback() {
      const t = cfPlayToken;
      const retry = (fn) => setTimeout(() => { if (t === cfPlayToken) fn(); }, 1500);
      if (cfModel.value === "aura-2" || cfModel.value === "aura-1") {
        const next = cfModel.value === "aura-2" ? "aura-1" : "melotts";
        setStatus(`Premium quota reached for this voice — switching to ${next === "aura-1" ? "Aura-1" : "MeloTTS"}...`);
        cfModel.value = next;
        syncCfModelUi();
        retry(playCloudflareChunk);
      } else {
        setStatus("Premium quota reached — switching to the free browser voice...");
        cfEnable.checked = false;
        // Nothing left to configure until the quota resets — fold the section
        // away (it opens by default, and re-opens if a key is ever needed).
        premiumSection.open = false;
        // Re-chunk for the browser engine, mapping the position by characters
        // (robust even if the engines' chunk sizes ever diverge again).
        const consumed = chunks.slice(0, chunkIndex).reduce((n, c) => n + c.length + 1, 0) + chunkCharOffset;
        retry(() => readText(textArea.value, 0, consumed));
      }
    }

    async function playCloudflareChunk() {
      if (chunkIndex >= chunks.length) {
        setStatus("Finished reading.");
        setControls("idle");
        clearPosition();
        return;
      }
      const token = ++cfPlayToken;
      highlightChunk(chunkIndex);
      buildSentenceSpans(chunkIndex);  // highlighted as the audio progresses
      setStatus(`Generating audio (part ${chunkIndex + 1} of ${chunks.length})...`);
      try {
        const blob = await fetchCfAudio(chunks[chunkIndex]);
        if (token !== cfPlayToken) return;  // superseded by a skip/stop/re-read
        cfPrepared = -1;  // any preloaded chunk is no longer the one after this
        const el = setCfSource(cfActive, blob);
        wireCfHandlers(el, token);

        await el.play();
        if (token !== cfPlayToken) return;
        // Sentence offsets map to time proportionally (TTS pace is steady).
        if (chunkCharOffset > 0 && isFinite(el.duration) && el.duration > 0) {
          el.currentTime = (chunkCharOffset / chunks[chunkIndex].length) * el.duration;
        }
        setControls("playing");
        setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
        prepareNextCfChunk(token);  // load the next chunk before this one ends
      } catch (error) {
        if (token !== cfPlayToken) return;
        // Autoplay blocked (shared-in article, no user gesture yet): the src
        // is loaded, so a tap on play resumes from here.
        if (error && error.name === "NotAllowedError") {
          setControls("paused");
          setStatus("Tap ▶ to start listening.");
          return;
        }
        if (error && error.code === "quota") {
          quotaFallback();
          return;
        }
        handleCfError(error);
      }
    }

    // Point one of the two elements at a chunk's audio, taking ownership of the
    // blob URL it replaces. Setting src resets playbackRate, so re-apply it.
    function setCfSource(slot, blob) {
      const el = cfPlayers[slot];
      if (cfObjectUrls[slot]) URL.revokeObjectURL(cfObjectUrls[slot]);
      cfObjectUrls[slot] = URL.createObjectURL(blob);
      el.src = cfObjectUrls[slot];
      el.playbackRate = Number(rateInput.value);
      el.load();  // start buffering now, not at play() time
      return el;
    }

    function wireCfHandlers(el, token) {
      el.onended = () => {
        if (token !== cfPlayToken) return;
        advanceCfChunk();
      };
      el.onerror = () => {
        if (token !== cfPlayToken) return;
        handleCfError(new Error("server"));
      };
    }

    // Fetch and buffer the chunk *after* the current one into the idle element
    // while the current one is still playing. Best effort: on failure the
    // handoff just falls back to the fetch-then-play path.
    async function prepareNextCfChunk(token) {
      const next = chunkIndex + 1;
      if (next >= chunks.length) return;
      try {
        const blob = await fetchCfAudio(chunks[next]);
        // Bail if playback moved on (skip, stop, or the chunk already advanced).
        if (token !== cfPlayToken || chunkIndex + 1 !== next) return;
        const el = setCfSource(1 - cfActive, blob);
        el.onended = null;
        // A load failure only invalidates the preload, it isn't a play error.
        el.onerror = () => { if (cfPrepared === next) cfPrepared = -1; };
        cfPrepared = next;
      } catch {
        cfPrepared = -1;
      }
    }

    // Chunk handoff, driven by `ended` — which still fires with the screen off.
    // Nothing may be awaited before play(): the platform can suspend the page
    // in a silent gap, which is exactly what used to stop playback mid-article.
    // So when the next chunk is already buffered we swap elements and start it
    // synchronously, and only then queue the following one.
    function advanceCfChunk() {
      const token = cfPlayToken;
      chunkCharOffset = 0;
      chunkIndex += 1;
      if (chunkIndex >= chunks.length) {
        setStatus("Finished reading.");
        setControls("idle");
        clearPosition();
        return;
      }
      if (cfPrepared !== chunkIndex) {
        playCloudflareChunk();  // not preloaded (slow network): fetch it now
        return;
      }
      // The outgoing element is done with; unwire it so a late ended/error
      // event on it can't advance the chunk a second time.
      const finished = cfAudio();
      finished.onended = null;
      finished.onerror = null;
      cfActive = 1 - cfActive;
      cfPrepared = -1;
      const el = cfAudio();
      wireCfHandlers(el, token);
      el.playbackRate = Number(rateInput.value);
      highlightChunk(chunkIndex);
      buildSentenceSpans(chunkIndex);
      setControls("playing");
      setStatus(`Reading part ${chunkIndex + 1} of ${chunks.length}...`);
      el.play().then(() => prepareNextCfChunk(token)).catch(() => {
        if (token !== cfPlayToken) return;
        playCloudflareChunk();  // refused (rare in background): retry the long way
      });
    }

    // --- Screen wake lock (browser engine only) ----------------------------
    // speechSynthesis suspends when the screen locks — no web API can prevent
    // that — so keep the screen awake while the browser voice is playing.
    // Premium audio plays fine with the screen off, so it takes no lock.
    // Best-effort: failures and unsupported browsers are silently ignored.
    let wakeLock = null;

    async function syncWakeLock() {
      const want = playbackState === "playing" && activeEngine() === "browser";
      if (want && !wakeLock && "wakeLock" in navigator) {
        try {
          const lock = await navigator.wakeLock.request("screen");
          // Playback may have paused/stopped while the request was in flight.
          if (playbackState === "playing" && activeEngine() === "browser") {
            wakeLock = lock;
            lock.addEventListener("release", () => {
              if (wakeLock === lock) wakeLock = null;
            });
          } else {
            lock.release().catch(() => {});
          }
        } catch {}
      } else if (!want && wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      // The platform releases wake locks when the tab is hidden; re-acquire.
      syncWakeLock();
      // If something outside our control (low memory, an interrupting call)
      // paused premium audio while we were backgrounded, pick it back up.
      const el = cfAudio();
      if (playbackState === "playing" && activeEngine() === "cloudflare" &&
          el.paused && el.currentSrc) {
        el.play().catch(() => {});
      }
    });

    // Highlight the sentence currently being spoken by the premium engine,
    // estimated from playback time (fires ~4x/sec — plenty for sentences).
    // Both elements report it; only the one currently playing matters.
    cfPlayers.forEach((player) => {
      player.addEventListener("timeupdate", () => {
        if (player !== cfAudio()) return;
        if (sentenceSpanIndex !== chunkIndex || !currentSentenceSpans.length) return;
        const d = player.duration;
        if (!isFinite(d) || d <= 0) return;
        const pos = (player.currentTime / d) * chunks[chunkIndex].length;
        const si = sentenceIndexAt(chunkIndex, pos);
        currentSentenceSpans.forEach((s, j) => s.el.classList.toggle("sentence-active", j === si));
      });
    });

    // --- Shared playback ---------------------------------------------------

    // Stop whichever engine is active and invalidate pending async work.
    function stopAll() {
      cfPlayToken++;
      clearInterval(speechTickTimer);
      speechSynthesis.cancel();
      currentUtterance = null;
      // Reset (don't discard) the persistent premium elements so they keep
      // their user-activation and can be replayed from the background. This
      // also drops the preloaded next chunk, which is no longer next.
      cfPrepared = -1;
      cfPlayers.forEach((el, i) => {
        el.pause();
        el.onended = null;
        el.onerror = null;
        el.removeAttribute("src");
        el.load();  // abort + release the current resource
        if (cfObjectUrls[i]) {
          URL.revokeObjectURL(cfObjectUrls[i]);
          cfObjectUrls[i] = null;
        }
      });
      clearWordSpans();
    }

    // Spotify-style prev: restart the current section; only a quick second
    // press (within PREV_DOUBLE_MS) goes back to the previous section.
    const PREV_DOUBLE_MS = 1000;
    let lastPrevTime = 0;

    function handlePrev() {
      const now = Date.now();
      const target = now - lastPrevTime < PREV_DOUBLE_MS ? chunkIndex - 1 : chunkIndex;
      lastPrevTime = now;
      playFrom(target);
    }

    // Jump to a chunk (optionally a sentence offset within it) and play from
    // there (used by prev/next, sentence steps, seeks, and re-reads).
    function playFrom(index, charOffset = 0) {
      if (!chunks.length) return;
      chunkIndex = Math.max(0, Math.min(index, chunks.length - 1));
      chunkCharOffset = Math.max(0, Math.min(charOffset, chunks[chunkIndex].length - 1));
      stopAll();
      setControls("playing");
      if (activeEngine() === "cloudflare") {
        playCloudflareChunk();
      } else {
        speakChunks();
        // If paused before skipping, some engines stay paused after
        // cancel()+speak(); resume() is a no-op when already playing.
        speechSynthesis.resume();
      }
    }

    function readText(text, startIndex = 0, startChar = null) {
      // Collapse runs of spaces but keep the line breaks: they carry the
      // article's structure (headings, list items) into chunkArticle().
      let lines = text
        .split(/\r?\n/)
        .map(l => l.replace(/\s+/g, " ").trim())
        .filter(Boolean);
      // Also trim here, so pasted text gets the same treatment as an extracted
      // article. Idempotent on already-cleaned text: a trimmed article starts
      // with prose, which leaves no head zone to scan.
      if (trimExtras.checked) lines = stripBoilerplate(lines, currentUrl ? articleTitle : "");
      const cleaned = lines.join("\n");
      if (!cleaned) {
        setStatus("Paste or load article text first.");
        return;
      }
      const engine = activeEngine();
      // Draw the narrator for this reading (a no-op unless "Random" is chosen).
      if (engine === "cloudflare") resolveCfVoice();
      stopAll();
      chunks = chunkArticle(cleaned, CHUNK_SIZE);
      computeSentenceStarts();
      chunkIndex = Math.max(0, Math.min(startIndex, chunks.length - 1));
      chunkCharOffset = 0;
      // A character-based start position (used when switching engines, whose
      // chunk sizes differ) overrides the chunk index; snap to its sentence.
      if (startChar != null) {
        let acc = 0, idx = 0;
        for (let i = 0; i < chunks.length; i++) {
          idx = i;
          if (startChar < acc + chunks[i].length) break;
          acc += chunks[i].length + 1;
        }
        chunkIndex = idx;
        const starts = sentenceStarts[idx] || [0];
        chunkCharOffset = starts[sentenceIndexAt(idx, Math.max(0, startChar - acc))];
      }
      renderChunks();
      // Optimistically enable controls; the engine confirms "playing".
      setControls("playing");
      if (engine === "cloudflare") {
        playCloudflareChunk();
      } else {
        speakChunks();
      }
    }

    async function loadArticle() {
      const url = urlInput.value.trim();
      if (!/^https?:\/\//i.test(url)) {
        setStatus("Enter a valid article URL starting with http or https.");
        return;
      }

      // Every new article starts at the user's chosen premium tier — normally
      // Aura-2 — even if the previous one was degraded by a quota fallback.
      restorePreferredCf();

      loadButton.disabled = true;
      setStatus("Extracting article text...");

      try {
        const readerUrl = `https://r.jina.ai/${url}`;
        // Ask Jina for clean plain text without images, and drop common page
        // chrome (nav/header/footer/sidebars) so it isn't read aloud.
        const response = await fetch(readerUrl, {
          headers: {
            "X-Return-Format": "text",
            "X-Retain-Images": "none",
            // Structural landmarks (safe everywhere) + conventional boilerplate
            // class names. Deliberately NOT <table> — old sites use it for layout.
            "X-Remove-Selector": [
              "nav", "header", "footer", "form", "aside",
              "[role=navigation]", "[role=banner]", "[role=contentinfo]",
              "[role=search]", "[role=complementary]", "[role=dialog]",
              ".infobox", ".navbox", ".toc", ".sidebar", ".breadcrumb", ".breadcrumbs",
              ".cookie", ".cookies", ".newsletter", ".advertisement", ".advert", ".ads", ".promo",
              ".social", ".social-share", ".share", ".sharing", ".related", ".related-articles",
              // Article furniture: cheaper to drop here than to regex out later.
              // Deliberately NOT <time> — plenty of sites use it mid-sentence.
              "figcaption", ".byline", ".author", ".author-bio", ".meta", ".post-meta",
              ".entry-meta", ".article-meta", ".date", ".published", ".timestamp",
              ".tags", ".comments", "#comments", ".paywall", ".subscribe", ".newsletter-signup",
              "[aria-label*=share]", "[class*=share-button]",
            ].join(","),
          },
        });
        if (!response.ok) throw new Error("Could not extract this article.");

        const raw = await response.text();
        // Use Jina's "Title:" line when present; otherwise derive from the URL.
        // Resolved before cleaning, which uses it to drop a repeated headline.
        const titleMatch = raw.match(/^Title:\s*(.+)$/mi);
        articleTitle = titleMatch ? titleMatch[1].trim() : titleFromUrl(url);

        const text = cleanArticle(raw, articleTitle);
        if (text.length < 80) throw new Error("The extracted article was too short.");

        rawArticle = raw;  // kept so the trim checkbox can re-clean this article
        textArea.value = text;
        currentUrl = url;
        // Resume where this article was last left off, if recent. Map the
        // saved chunk position proportionally to characters, so it survives
        // chunk-size changes (tuned constants, or a different engine).
        const pos = getPosition(url);
        readText(text, 0, pos && pos.index > 0
          ? Math.floor((pos.index / Math.max(pos.total || 1, 1)) * text.length)
          : null);
        if (pos && pos.index > 0) {
          setStatus(`Resuming at part ${chunkIndex + 1} of ${chunks.length}...`);
        }
      } catch (error) {
        // Extraction failed -> nothing will play, so make sure controls reflect idle.
        setControls("idle");
        setStatus(`${error.message} Paste the article text below and press "Read pasted text".`);
      } finally {
        loadButton.disabled = false;
      }
    }

    // Live feedback while dragging: label, and premium audio (which supports
    // live speed changes, unlike speechSynthesis).
    function applyRate() {
      const rate = Number(rateInput.value);
      rateValue.textContent = rate.toFixed(2);
      cfPlayers.forEach((el) => { el.playbackRate = rate; });
      rateDown.disabled = rate <= Number(rateInput.min);
      rateUp.disabled = rate >= Number(rateInput.max);
    }

    // speechSynthesis can't change rate mid-utterance, so once the new speed is
    // settled, re-speak from the current sentence (only while actively playing).
    function commitRate() {
      savePrefs();
      if (playbackState === "playing" && activeEngine() === "browser") {
        const starts = sentenceStarts[chunkIndex] || [0];
        playFrom(chunkIndex, starts[sentenceIndexAt(chunkIndex, currentCharPos())]);
      }
    }

    rateInput.addEventListener("input", applyRate);
    rateInput.addEventListener("change", commitRate);

    // The -/+ buttons move by one slider step, which is much easier to hit
    // precisely than the thumb — especially on a phone.
    function nudgeRate(delta) {
      const value = Number(rateInput.value);
      const next = Math.min(Number(rateInput.max), Math.max(Number(rateInput.min), value + delta));
      const rounded = Math.round(next * 100) / 100;  // keep 0.05 steps exact
      if (rounded === value) return;
      rateInput.value = rounded;
      applyRate();
      commitRate();
    }

    rateDown.addEventListener("click", () => nudgeRate(-0.05));
    rateUp.addEventListener("click", () => nudgeRate(0.05));

    loadButton.addEventListener("click", loadArticle);
    readTextButton.addEventListener("click", () => {
      currentUrl = "";  // pasted text isn't tied to a URL, so don't resume it
      articleTitle = "Pasted text";
      readText(textArea.value);
    });

    // Re-read the already-loaded text when the chosen voice/engine changes —
    // no need to re-fetch from Jina, since the content is in the textarea.
    // Keep the position by character count so it survives any re-chunking
    // (a raw chunk index wouldn't if chunk sizing ever changes).
    function reReadIfLoaded() {
      if (!textArea.value.trim()) return;
      const consumed = chunks.slice(0, chunkIndex).reduce((n, c) => n + c.length + 1, 0) + chunkCharOffset;
      readText(textArea.value, 0, chunks.length ? consumed : null);
    }
    voiceSelect.addEventListener("change", () => { savePrefs(); reReadIfLoaded(); });

    function togglePlayPause() {
      if (playbackState === "playing") {
        if (activeEngine() === "cloudflare") {
          cfAudio().pause();
        } else {
          speechSynthesis.pause();
        }
        setControls("paused");
      } else if (playbackState === "paused") {
        if (activeEngine() === "cloudflare") {
          cfAudio().play().catch(() => {});
        } else if (speechSynthesis.paused) {
          speechSynthesis.resume();
        } else {
          // Nothing to resume — speech never started (blocked autoplay after
          // a share). Re-speak the current chunk; playFrom sets the controls.
          playFrom(chunkIndex);
          return;
        }
        setControls("playing");
      }
    }
    playPauseButton.addEventListener("click", togglePlayPause);
    restartButton.addEventListener("click", () => playFrom(0));
    prevButton.addEventListener("click", handlePrev);
    nextButton.addEventListener("click", () => playFrom(chunkIndex + 1));
    prevSentenceButton.addEventListener("click", () => stepSentence(-1));
    nextSentenceButton.addEventListener("click", () => stepSentence(1));

    // Tap the progress bar to jump anywhere in the article.
    progressEl.addEventListener("click", (e) => {
      if (!chunks.length || playbackState === "idle") return;
      const rect = progressEl.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      playFrom(Math.floor(pct * chunks.length));
    });

    // Keyboard shortcuts: Space/K play-pause, arrows skip. Ignored while typing.
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                t.tagName === "SELECT" || t.tagName === "BUTTON" ||
                t.isContentEditable)) return;
      if (playbackState === "idle") return;
      if (e.key === " " || e.key === "k") {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (!prevButton.disabled) handlePrev();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        if (!nextButton.disabled) playFrom(chunkIndex + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        stepSentence(-1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        stepSentence(1);
      }
    });

    // --- Media Session (lock-screen / headphone controls) ------------------
    // Works for premium audio on all platforms; for the browser voice it
    // appears where the platform attaches a media session to speech.
    function setupMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const ms = navigator.mediaSession;
      const set = (action, fn) => { try { ms.setActionHandler(action, fn); } catch {} };
      set("play", () => { if (playbackState === "paused") togglePlayPause(); });
      set("pause", () => { if (playbackState === "playing") togglePlayPause(); });
      set("previoustrack", () => { if (!prevButton.disabled) handlePrev(); });
      set("nexttrack", () => { if (!nextButton.disabled) playFrom(chunkIndex + 1); });
      set("seekbackward", () => { if (!prevButton.disabled) handlePrev(); });
      set("seekforward", () => { if (!nextButton.disabled) playFrom(chunkIndex + 1); });
    }

    function updateMediaSession() {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.playbackState =
        playbackState === "playing" ? "playing" :
        playbackState === "paused" ? "paused" : "none";
      if (chunks.length && "MediaMetadata" in window) {
