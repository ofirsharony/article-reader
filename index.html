<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8A%3C/text%3E%3C/svg%3E" />
  <meta name="theme-color" content="#6d5efc" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      color-scheme: light dark;
      --accent: #6d5efc;
      --accent-2: #b14bf4;
      --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
      --ring: color-mix(in srgb, var(--accent) 45%, transparent);
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 56px;
      line-height: 1.55;
      background: radial-gradient(1100px 420px at 50% -160px,
        color-mix(in srgb, var(--accent) 24%, transparent), transparent);
    }
    .card {
      border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
      border-radius: 18px;
      padding: 24px;
      background: color-mix(in srgb, Canvas 94%, var(--accent) 4%);
      box-shadow: 0 14px 44px rgb(0 0 0 / 0.12);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.intro { margin: 0 0 20px; opacity: 0.75; }
    label { display: block; font-weight: 650; margin: 16px 0 7px; }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      border-radius: 11px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      padding: 12px;
      background: Canvas;
      color: CanvasText;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    input[type="range"] {
      border: none; background: transparent; padding: 0;
      accent-color: var(--accent);
    }
    textarea { min-height: 150px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      cursor: pointer;
      margin-top: 12px;
      font-weight: 700;
      border: none;
      transition: transform .05s ease, filter .15s ease, background .2s ease;
    }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 6px 18px var(--accent-soft);
    }
    button.primary:hover { filter: brightness(1.06); }
    #readTextButton { background: color-mix(in srgb, var(--accent) 12%, Canvas); color: CanvasText; }
    button:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    button.toggle {
      font-size: 22px; line-height: 1; padding: 12px;
      background: color-mix(in srgb, var(--accent) 14%, Canvas);
      color: CanvasText;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    button.toggle:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 24%, Canvas); }
    #playPauseButton:not(:disabled) {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff; border: none;
    }
    /* Speed slider flanked by -/+ nudge buttons, for one-step (0.05) changes
       that are far easier to hit than dragging the thumb on a phone. */
    .speed { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    button.nudge {
      width: 40px; margin: 0; padding: 7px 0;
      font-size: 19px; line-height: 1;
      background: color-mix(in srgb, var(--accent) 14%, Canvas);
      color: CanvasText;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    button.nudge:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 24%, Canvas); }
    .premium, details.manual {
      margin-top: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      border-radius: 13px;
      padding: 12px 14px;
    }
    summary { font-weight: 650; cursor: pointer; }
    .premium .row { margin-top: 8px; }
    .premium .check {
      display: flex; align-items: center; gap: 8px;
      font-weight: 650; margin: 12px 0 4px;
    }
    .premium .check input { width: auto; }
    .check.standalone {
      display: flex; align-items: center; gap: 8px;
      margin: 14px 0 0; font-size: 14px; cursor: pointer;
    }
    .check.standalone input { width: auto; }
    .premium input[type="password"] { margin-top: 6px; }
    /* Progress bar across the whole article. Tappable to seek: the visible
       track is 6px; vertical padding widens the touch target invisibly. */
    #progress {
      margin-top: 14px;
      height: 18px;
      padding: 6px 0;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      background-clip: content-box;
      cursor: pointer;
      overflow: hidden;
      display: none;
    }
    #progress.active { display: block; }
    #progressBar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }
    #status {
      margin-top: 12px; min-height: 22px; font-weight: 600;
      color: var(--accent);
    }
    /* Animated dots while a phase is in flight, so a slow extraction or a
       first-audio wait doesn't look like a hang. */
    #status.busy::after {
      content: "";
      display: inline-block; width: 1.1em; text-align: left;
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75% { content: "···"; } }
    /* The most recent in-progress article, promoted to a tappable card. */
    .recent-item.continue {
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      background: var(--accent-soft);
      padding: 11px 12px;
    }
    .recent-item.continue .recent-title { font-size: 15px; }
    .recent-play { font-size: 15px; color: var(--accent); }
    .recent-offline { font-size: 11px; opacity: 0.6; }
    /* Recently played: in-progress articles you can tap to resume. */
    #recent { margin-top: 10px; display: none; }
    #recent.active { display: block; }
    .recent-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; margin: 4px 0;
      border: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
      border-radius: 10px; cursor: pointer;
      transition: background .15s ease;
    }
    .recent-item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .recent-title {
      flex: 1; min-width: 0; font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .recent-meta { font-size: 12px; opacity: 0.65; white-space: nowrap; }
    .recent-remove {
      width: auto; margin: 0; padding: 2px 8px;
      background: transparent; border: none; font-size: 15px; opacity: 0.5;
    }
    .recent-remove:hover { opacity: 1; }
    /* Article title + what the trim removed, shown once an article is loaded. */
    #articleHeader { display: none; margin-top: 14px; }
    #articleHeader.active { display: block; }
    #articleTitleEl {
      margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700;
    }
    #trimInfo { margin-top: 4px; font-size: 13px; opacity: 0.7; }
    #trimInfo summary { font-weight: 500; cursor: pointer; }
    #trimInfo[hidden] { display: none; }
    #trimList {
      margin-top: 6px; max-height: 30vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
      font-size: 12px; scrollbar-width: thin;
    }
    #trimList span, #trimList button {
      flex: 0 0 auto;   /* a scrolling flex column would otherwise squash them */
      width: auto; margin: 0; text-align: left; font: inherit;
      padding: 3px 7px; border-radius: 6px; border: none;
      background: color-mix(in srgb, CanvasText 6%, transparent);
      color: CanvasText;
      text-decoration: line-through; opacity: 0.75;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #trimList button.trim-line { cursor: pointer; }
    #trimList button.trim-line:hover {
      text-decoration: none; opacity: 1;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    /* Hovering says what the click will do: keep this line, on this site. */
    #trimList button.trim-line:hover::before { content: "↩ keep  "; font-weight: 700; }
    #trimList .trim-more { text-decoration: none; background: none; }
    #trimList button.trim-reset {
      margin-top: 6px; text-decoration: none; cursor: pointer;
      background: none; color: var(--accent); opacity: 1; font-weight: 600;
    }
    /* Reading-view toolbar: text size and full-screen. */
    #readerBar {
      display: none; gap: 6px; justify-content: flex-end; margin-top: 12px;
    }
    #readerBar.active { display: flex; }
    /* Direct children only: the speed cluster is moved in here in full-screen
       mode (see toggleImmersive) and keeps its own .nudge sizing. */
    #readerBar > button { width: auto; padding: 4px 10px; font-size: 13px; }
    #readerBar > #immersiveButton { padding: 6px 13px; font-size: 18px; }
    /* Speed + time left, shown only in full-screen mode. */
    #fsMeta { display: none; }
    /* Reading view: shows the article split into chunks, highlighting the one
       currently being spoken and auto-scrolling it into view. `--read-scale` is
       the user's text-size choice, persisted with the other prefs. */
    #reader {
      margin-top: 8px;
      max-height: 44vh;
      overflow-y: auto;
      padding: 4px;
      border-radius: 12px;
      display: none;
      scrollbar-width: thin;
      font-size: calc(16px * var(--read-scale, 1));
    }
    #reader.active { display: block; }
    /* Full-screen reading mode: the reader takes the viewport and the transport
       controls dock to the bottom, so following along doesn't cost the
       playback buttons. */
    body.immersive { overflow: hidden; }
    body.immersive #reader {
      position: fixed; inset: 0 0 92px; z-index: 50;
      max-height: none; margin: 0; border-radius: 0;
      /* Top padding clears the docked toolbar so the first chunk isn't under it. */
      padding: 64px max(16px, calc((100vw - 720px) / 2)) 24px;
      background: Canvas;
    }
    body.immersive .controls {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
      margin: 0; padding: 12px max(16px, calc((100vw - 720px) / 2));
      background: color-mix(in srgb, CanvasText 5%, Canvas);
      border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }
    /* Shown while a press-and-hold speed boost is active. */
    #boostPill {
      position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
      bottom: 24px; padding: 6px 14px; border-radius: 999px;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
      display: none; pointer-events: none;
    }
    #boostPill.active { display: block; }
    body.immersive #boostPill { bottom: 104px; }
    /* Full-screen toolbar: speed on the left, time left in the middle, exit on
       the right. Text size lives in the settings pane — full screen is for
       listening, and the reader is already sized by then. */
    body.immersive #readerBar {
      position: fixed; top: 10px; left: 12px; right: 12px; z-index: 52; margin: 0;
      justify-content: space-between; align-items: center; gap: 12px;
      padding: 6px 10px; border-radius: 12px;
      background: color-mix(in srgb, CanvasText 6%, Canvas);
    }
    body.immersive #readerBar .speed { flex: 0 1 240px; min-width: 150px; }
    body.immersive #fontDown, body.immersive #fontUp { display: none; }
    body.immersive #fsMeta {
      display: block; font-size: 13px; opacity: 0.7; white-space: nowrap;
    }
    .chunk {
      display: block;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 10px;
      border-left: 3px solid transparent;
      opacity: 0.55;
      cursor: pointer;
      transition: background .2s ease, opacity .2s ease;
    }
    .chunk:hover { opacity: 0.85; background: color-mix(in srgb, var(--accent) 8%, transparent); }
    /* Section titles get their own chunk (see chunkArticle) so they can read as
       headings instead of more body text. */
    .chunk.heading {
      font-size: 1.15em;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0.75;
      margin: 18px 0 2px;
      padding-bottom: 4px;
    }
    .chunk.heading:first-child { margin-top: 6px; }
    .chunk.heading.active { opacity: 1; }
    .chunk.active {
      opacity: 1;
      background: var(--accent-soft);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    /* Per-word highlight (browser engine where onboundary is supported). */
    .chunk .word-active {
      background: color-mix(in srgb, var(--accent) 38%, transparent);
      border-radius: 4px;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    /* Per-sentence highlight (premium engine, estimated from audio time). */
    .chunk .sentence-active {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: 4px;
    }
    #eta {
      margin-top: 6px;
      min-height: 16px;
      font-size: 13px;
      opacity: 0.7;
      text-align: right;
    }
    @media (max-width: 620px) {
      .row { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Article Reader</h1>
    <p class="intro">Paste an article URL. The page extracts the readable text and reads it aloud in a natural voice.</p>

    <label for="url">Article URL</label>
    <input id="url" type="url" placeholder="https://example.com/article" autocomplete="url" />

    <div id="recent" aria-label="Recently played"></div>

    <div class="row">
      <div>
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div>
        <label for="rate">Speed: <span id="rateValue">1.0</span>x</label>
        <div class="speed">
          <button type="button" id="rateDown" class="nudge" aria-label="Slower by 0.05" title="Slower (-0.05)">&minus;</button>
          <input id="rate" type="range" min="0.7" max="2" step="0.05" value="1" />
          <button type="button" id="rateUp" class="nudge" aria-label="Faster by 0.05" title="Faster (+0.05)">+</button>
        </div>
      </div>
    </div>

    <details class="premium" id="premiumSection" open>
      <summary>Premium voices</summary>
      <label class="check">
        <input type="checkbox" id="cfEnable" checked /> Use premium voice
      </label>
      <div class="row">
        <div>
          <label for="cfModel">Model</label>
          <select id="cfModel">
            <option value="melotts">MeloTTS — English (high volume)</option>
            <option value="aura-1">Aura-1 — natural voices</option>
            <option value="aura-2" selected>Aura-2 — best quality</option>
          </select>
        </div>
        <div>
          <label for="cfVoice">Voice</label>
          <select id="cfVoice" disabled></select>
        </div>
      </div>
      <label for="cfKey">Access key</label>
      <input id="cfKey" type="password" placeholder="Your access key" autocomplete="off" />
    </details>

    <label class="check standalone" title="Drop dates, bylines, share links, related-article lists and similar page furniture">
      <input type="checkbox" id="trimExtras" checked /> Trim article extras
    </label>

    <button class="primary" id="loadButton">Load and read</button>

    <div class="controls">
      <button id="restartButton" class="toggle" disabled aria-label="Restart from beginning" title="Restart from beginning">&#8634;</button>
      <button id="prevButton" class="toggle" disabled aria-label="Previous section" title="Previous section">&#9198;</button>
      <button id="prevSentenceButton" class="toggle" disabled aria-label="Previous sentence" title="Previous sentence">&#8249;</button>
      <button id="playPauseButton" class="toggle" disabled aria-label="Play">&#9654;</button>
      <button id="nextSentenceButton" class="toggle" disabled aria-label="Next sentence" title="Next sentence">&#8250;</button>
      <button id="nextButton" class="toggle" disabled aria-label="Next section" title="Next section">&#9197;</button>
    </div>

    <div id="progress" aria-label="Seek to a position in the article" title="Tap to seek"><div id="progressBar"></div></div>
    <div id="eta" aria-hidden="true"></div>

    <div id="status" aria-live="polite"></div>

    <div id="articleHeader">
      <h2 id="articleTitleEl"></h2>
      <details id="trimInfo">
        <summary id="trimSummary"></summary>
        <div id="trimList"></div>
      </details>
    </div>

    <div id="readerBar">
      <button type="button" id="fontDown" class="nudge" aria-label="Smaller text" title="Smaller text">A&minus;</button>
      <button type="button" id="fontUp" class="nudge" aria-label="Larger text" title="Larger text">A+</button>
      <span id="fsMeta" aria-hidden="true"></span>
      <button type="button" id="immersiveButton" class="nudge" aria-label="Full-screen reading mode" title="Full-screen reading mode">&#9974;</button>
    </div>

    <div id="reader" title="Tap a sentence to read from there, or the margin to pause. Swipe for the next sentence, hold to speed up."></div>
    <div id="boostPill" aria-hidden="true"></div>

    <details class="manual">
      <summary>Paste or edit text manually</summary>
      <label for="text">Article text</label>
      <textarea id="text" placeholder="Paste article text here, then press Read this text."></textarea>
      <button id="readTextButton">Read this text</button>
    </details>
  </main>

  <script>
    const urlInput = document.getElementById("url");
    const recentEl = document.getElementById("recent");
    const voiceSelect = document.getElementById("voice");
    const rateInput = document.getElementById("rate");
    const rateValue = document.getElementById("rateValue");
    const rateDown = document.getElementById("rateDown");
    const rateUp = document.getElementById("rateUp");
    const textArea = document.getElementById("text");
    const trimExtras = document.getElementById("trimExtras");
    const articleHeader = document.getElementById("articleHeader");
    const articleTitleEl = document.getElementById("articleTitleEl");
    const trimInfo = document.getElementById("trimInfo");
    const trimSummary = document.getElementById("trimSummary");
    const trimList = document.getElementById("trimList");
    const readerBar = document.getElementById("readerBar");
    const fontDown = document.getElementById("fontDown");
    const fontUp = document.getElementById("fontUp");
    const immersiveButton = document.getElementById("immersiveButton");
    const fsMeta = document.getElementById("fsMeta");
    // The one speed cluster, relocated into the full-screen toolbar rather than
    // duplicated there — one slider means no two-way syncing and no extra listeners.
    const speedBox = document.querySelector(".speed");
    const speedHome = speedBox.parentElement;
    const boostPill = document.getElementById("boostPill");
    const statusEl = document.getElementById("status");
    const readerEl = document.getElementById("reader");
    const progressEl = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");
    const etaEl = document.getElementById("eta");
    const loadButton = document.getElementById("loadButton");
    const readTextButton = document.getElementById("readTextButton");
    const restartButton = document.getElementById("restartButton");
    const prevButton = document.getElementById("prevButton");
    const prevSentenceButton = document.getElementById("prevSentenceButton");
    const nextSentenceButton = document.getElementById("nextSentenceButton");
    const playPauseButton = document.getElementById("playPauseButton");
    const nextButton = document.getElementById("nextButton");
    const cfEnable = document.getElementById("cfEnable");
    const cfModel = document.getElementById("cfModel");
    const cfVoice = document.getElementById("cfVoice");
    const cfKey = document.getElementById("cfKey");
    const premiumSection = document.getElementById("premiumSection");

    // Set this to your deployed Worker URL (see worker/README.md). Not secret —
    // the access key protects it.
    const CF_WORKER_URL = "https://article-reader-tts.article-reader.workers.dev";
    const CF_KEY_STORAGE = "cf_access_key";
    const PREFS_STORAGE = "ar_prefs";        // saved voice/speed/model choices
    // Bumped when stored premium prefs can't be trusted, in which case the
    // markup defaults win: v1 persisted quota-fallback degradations (pinning a
    // weaker tier, or the free voice, forever), and v2 stored the then-default
    // voice explicitly, which would override the new Random default.
    const PREFS_VERSION = 3;
    const POS_STORAGE = "ar_positions";      // per-URL resume positions
    const POS_TTL_MS = 7 * 24 * 60 * 60 * 1000;  // forget resume points after 7 days
    const AUDIO_CACHE_MAX = 40;              // in-memory premium-audio cache cap
    const RULES_STORAGE = "ar_trim_rules";   // per-site "keep this line" corrections
    const RULES_SITES_MAX = 40;              // sites remembered, LRU beyond that
    const RULES_PER_SITE_MAX = 50;           // corrections per site
    const TEXT_CACHE_KEEP = 4;               // articles whose text is kept for offline replay
    const TEXT_CACHE_MAX = 120000;           // ...and the per-article size ceiling
    // Curated, narration-friendly US voices only (no Irish/British/heavy accents).
    const AURA_VOICES = [
      "asteria", "luna", "stella", "hera",   // female
      "orion", "arcas", "perseus", "zeus",   // male
    ];
    const AURA2_VOICES = [
      "luna", "asteria", "aurora", "hera",   // female
      "apollo", "orion", "orpheus", "zeus",  // male
    ];
    // The premium voice select's default entry: a real voice is drawn from the
    // active model's list per reading (see resolveCfVoice), so the Worker never
    // sees this sentinel — activeCfVoice is what gets sent.
    const RANDOM_VOICE = "random";
    let activeCfVoice = "";
    const CHUNK_SIZE = 400;      // both engines; also bounds premium first-audio latency
    const FIRST_CHUNK_SIZE = 160;  // the chunk the listener actually waits for
    const CHARS_PER_SEC = 15;    // rough TTS reading speed at rate 1.0, for ETA

    const PLAY_ICON = "▶";   // ▶
    const PAUSE_ICON = "⏸";  // ⏸
    let playbackState = "idle";   // "idle" | "playing" | "paused"
    let currentUtterance = null;  // browser engine guard
    // Two persistent elements for premium audio, alternating per chunk. Each is
    // created once and only ever re-`src`ed (never replaced with new Audio()),
    // so the user-activation from the first tap carries over to every later
    // chunk. Double-buffering is what keeps playback alive with the screen off:
    // the next chunk is fetched and loaded into the idle element *while* the
    // current one plays, so the handoff in `onended` is a synchronous play() on
    // an already-buffered element — no fetch, no load, nothing awaited in the
    // gap where the platform would otherwise suspend us.
    const cfPlayers = [createCfPlayer(), createCfPlayer()];
    let cfActive = 0;                 // index of the element currently playing
    const cfObjectUrls = [null, null];  // blob URL held by each element (to revoke)
    let cfPrepared = -1;              // chunk index preloaded into the idle element
    let cfPlayToken = 0;              // cloudflare async guard (discard stale fetches)

    function createCfPlayer() {
      const el = new Audio();
      el.preload = "auto";
      el.playsInline = true;
      // In the document (rather than detached) so the engine treats it as a
      // real media element for audio focus and background playback.
      document.body.appendChild(el);
      return el;
    }

    function cfAudio() { return cfPlayers[cfActive]; }

    // Declares long-form playback: on iOS this keeps audio running with the
    // screen off and ignores the ringer switch. Ignored where unsupported.
    try {
      if ("audioSession" in navigator) navigator.audioSession.type = "playback";
    } catch {}

    let voices = [];
    let chunks = [];
    let chunkKinds = [];          // per chunk: "heading" | "body" (see chunkArticle)
    let chunkIndex = 0;
    // Sentence-level position within the current chunk. chunkCharOffset is
    // where playback of this chunk started (0 = chunk start); lastBoundaryAbs
    // tracks the browser engine's spoken position via onboundary events.
    let chunkCharOffset = 0;
    let lastBoundaryAbs = 0;
    let sentenceStarts = [];      // per chunk: char offsets where sentences begin
    let chunkEls = [];            // rendered chunk elements in the reading view
    let currentUrl = "";          // article URL for resume tracking ("" = pasted text)
    let rawArticle = "";          // last extraction, re-cleaned when trimming is toggled
    let trimmedLines = [];        // what the last clean removed, listed under the title
    let cleanedSource = "";       // cleanArticle()'s last output, so readText() doesn't re-trim it
    let readScale = 1;            // reading-view text size multiplier
    let etaLabel = "";            // last rendered "time left", reused by the full-screen readout
    let boostRate = 0;            // press-and-hold speed multiplier (0 = off)
    let trimHost = "";            // hostname whose trim corrections apply ("" = pasted text)
    let articleTitle = "Article"; // for the lock-screen / media metadata
    const audioCache = new Map(); // key `${model}|${voice}|${text}` -> Blob (session only)

    // Per-word highlighting state (browser engine, where onboundary fires).
    let currentWordSpans = [];    // [{ start, end, el }] for the active chunk
    let wordSpanIndex = -1;       // which chunk currently has word spans

    // Per-sentence highlighting state (premium engine, no boundary events —
    // the position is estimated from audio time, so sentence granularity).
    let currentSentenceSpans = [];  // [{ el }] per sentence of the active chunk
    let sentenceSpanIndex = -1;     // which chunk currently has sentence spans
    let speechTickTimer = null;     // browser-engine fallback highlight timer

    function activeEngine() {
      return cfEnable.checked ? "cloudflare" : "browser";
    }

    // `busy` marks a phase that is still in flight, which the CSS turns into
    // animated dots so a slow extraction doesn't read as a hang.
    function setStatus(message, busy = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("busy", busy);
    }

    // --- Persistence (preferences + resume position) -----------------------
    // localStorage has no built-in expiry, so prefs persist indefinitely.
    // Resume positions carry a timestamp and are pruned after POS_TTL_MS.

    function loadJson(key) {
      try { return JSON.parse(localStorage.getItem(key)) || {}; }
      catch { return {}; }
    }

    // The premium tier the user *chose*, kept separate from what is currently
    // active: quotaFallback() degrades the live model (or drops to the free
    // voice) mid-article, and that must neither be persisted nor carried into
    // the next article. restorePreferredCf() puts the choice back.
    let preferredCf = null;

    function snapshotCfPrefs() {
      preferredCf = { enable: cfEnable.checked, model: cfModel.value, voice: cfVoice.value };
    }

    function restorePreferredCf() {
      if (!preferredCf) return;
      cfEnable.checked = preferredCf.enable;
      cfModel.value = preferredCf.model;
      syncCfModelUi();  // repopulates the voice list for the restored model
      if (preferredCf.voice) cfVoice.value = preferredCf.voice;
      resolveCfVoice();  // after the select is back to the chosen value
    }

    function savePrefs() {
      // Persist the chosen tier, never a degraded one (see preferredCf).
      const cf = preferredCf ||
        { enable: cfEnable.checked, model: cfModel.value, voice: cfVoice.value };
      localStorage.setItem(PREFS_STORAGE, JSON.stringify({
        v: PREFS_VERSION,
        voice: voiceSelect.selectedOptions[0]?.textContent || "",
        rate: rateInput.value,
        cfEnable: cf.enable,
        cfModel: cf.model,
        cfVoice: cf.voice,
        trim: trimExtras.checked,
        read: readScale,
      }));
    }

    function savePosition() {
      if (!currentUrl || !chunks.length) return;
      const all = loadJson(POS_STORAGE);
      const text = chunks.join("\n");
      all[currentUrl] = {
        index: chunkIndex, total: chunks.length, t: Date.now(), title: articleTitle,
        // The cleaned text rides along so the article can be replayed with no
        // network — offline, or when extraction later fails.
        text: text.length <= TEXT_CACHE_MAX ? text : "",
      };
      // Prune entries older than the TTL so the store can't grow forever.
      const now = Date.now();
      for (const k of Object.keys(all)) {
        if (now - (all[k].t || 0) > POS_TTL_MS) delete all[k];
      }
      // Only the few most recent articles keep their text; the rest keep just
      // the position, which is all the recents list needs.
      Object.entries(all)
        .sort((a, b) => b[1].t - a[1].t)
        .slice(TEXT_CACHE_KEEP)
        .forEach(([k]) => { all[k].text = ""; });
      try {
        localStorage.setItem(POS_STORAGE, JSON.stringify(all));
      } catch {
        // Storage full: positions matter more than cached text.
        for (const k of Object.keys(all)) all[k].text = "";
        try { localStorage.setItem(POS_STORAGE, JSON.stringify(all)); } catch {}
      }
    }

    function getPosition(url) {
      const p = loadJson(POS_STORAGE)[url];
      if (!p || Date.now() - (p.t || 0) > POS_TTL_MS) return null;
      return p;
    }

    function clearPosition() {
      if (!currentUrl) return;
      const all = loadJson(POS_STORAGE);
      delete all[currentUrl];
      localStorage.setItem(POS_STORAGE, JSON.stringify(all));
    }

    // --- Per-site trim corrections ------------------------------------------
    // Tapping a line in the "Trimmed N extras" list says "this isn't junk on
    // this site" — and nav labels repeat verbatim across a site, so the
    // correction is keyed by hostname rather than by URL and transfers to every
    // later article there. Stored as normalized text, not a hash, so the rule
    // stays inspectable. Corrections are preferences: no TTL, just LRU caps.

    function siteKey(url) {
      try { return new URL(url).hostname.toLowerCase(); } catch { return ""; }
    }

    function normLine(line) {
      return line.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim().slice(0, 100);
    }

    function loadRules() {
      const all = loadJson(RULES_STORAGE);
      return all && all.v === 1 && all.sites ? all : { v: 1, sites: {} };
    }

    // The lines this site is allowed to keep, as a Set for the hot path.
    function keepSet(host) {
      const site = host && loadRules().sites[host];
      return new Set(site ? site.keep : []);
    }

    function addKeepRule(host, line) {
      if (!host) return;
      const all = loadRules();
      const site = all.sites[host] || { keep: [], t: 0 };
      const norm = normLine(line);
      if (!site.keep.includes(norm)) site.keep.push(norm);
      // Newest corrections win when the cap bites.
      site.keep = site.keep.slice(-RULES_PER_SITE_MAX);
      site.t = Date.now();
      all.sites[host] = site;
      const hosts = Object.entries(all.sites).sort((a, b) => b[1].t - a[1].t);
      all.sites = Object.fromEntries(hosts.slice(0, RULES_SITES_MAX));
      try { localStorage.setItem(RULES_STORAGE, JSON.stringify(all)); } catch {}
    }

    function clearSiteRules(host) {
      const all = loadRules();
      delete all.sites[host];
      try { localStorage.setItem(RULES_STORAGE, JSON.stringify(all)); } catch {}
    }

    // --- Recently played ----------------------------------------------------
    // In-progress articles (saved position, not yet finished), tap to resume.
    // Rendered while idle so items don't move around under the user's finger.

    function timeAgo(t) {
      const s = Math.round((Date.now() - t) / 1000);
      if (s < 90) return "just now";
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      return `${Math.round(s / 86400)} d ago`;
    }

    function removePosition(url) {
      const all = loadJson(POS_STORAGE);
      delete all[url];
      localStorage.setItem(POS_STORAGE, JSON.stringify(all));
    }

    function renderRecent() {
      const now = Date.now();
      const items = Object.entries(loadJson(POS_STORAGE))
        .filter(([, p]) => now - (p.t || 0) <= POS_TTL_MS)
        .sort((a, b) => b[1].t - a[1].t)
        .slice(0, 5);
      recentEl.innerHTML = "";
      recentEl.classList.toggle("active", items.length > 0);
      items.forEach(([url, p], i) => {
        const item = document.createElement("div");
        // The most recent article is promoted to a "continue" card: resuming
        // one thing is the common case, picking from a list is the rare one.
        item.className = i === 0 ? "recent-item continue" : "recent-item";
        const title = document.createElement("span");
        title.className = "recent-title";
        title.textContent = (i === 0 ? "Continue: " : "") + (p.title || titleFromUrl(url));
        const meta = document.createElement("span");
        meta.className = "recent-meta";
        const pct = p.total ? Math.round(((p.index + 1) / p.total) * 100) : 0;
        meta.textContent = `${pct}% · ${timeAgo(p.t || now)}`;
        if (p.text) {
          const offline = document.createElement("span");
          offline.className = "recent-offline";
          offline.textContent = "✓ saved";
          offline.title = "Saved for offline listening";
          meta.append(" ", offline);
        }
        const remove = document.createElement("button");
        remove.className = "recent-remove";
        remove.textContent = "✕";
        remove.setAttribute("aria-label", `Remove "${title.textContent}" from the list`);
        remove.addEventListener("click", (e) => {
          e.stopPropagation();
          removePosition(url);
          renderRecent();
        });
        if (i === 0) {
          const play = document.createElement("span");
          play.className = "recent-play";
          play.textContent = "▶";
          item.append(play);
        }
        item.append(title, meta, remove);
        item.addEventListener("click", () => {
          urlInput.value = url;
          loadArticle();
        });
        recentEl.appendChild(item);
      });
    }

    // --- Premium audio cache (in-memory, this page session only) -----------

    function cfCacheKey(text) {
      return `${cfModel.value}|${activeCfVoice}|${text}`;
    }

    function cacheAudio(key, blob) {
      audioCache.set(key, blob);
      // Simple FIFO eviction once we exceed the cap.
      while (audioCache.size > AUDIO_CACHE_MAX) {
        audioCache.delete(audioCache.keys().next().value);
      }
    }

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = "";

      // Voices to hide: macOS/Windows novelty/robotic voices, plus a few
      // natural ones the user opted out of (Tessa, Rishi).
      const noveltyVoices = new Set([
        "Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos",
        "Eddy", "Flo", "Fred", "Good News", "Grandma", "Grandpa", "Jester",
        "Junior", "Kathy", "Organ", "Ralph", "Reed", "Rishi", "Rocko",
        "Sandy", "Shelley", "Superstar", "Tessa", "Trinoids", "Whisper",
        "Wobble", "Zarvox"
      ]);

      // Only neutral English accents — keep US and UK, drop Irish (en-IE),
      // Australian (en-AU), Indian (en-IN), South African (en-ZA), etc.
      const allowedLocales = new Set(["en-us", "en-gb"]);

      const englishVoices = voices.filter(v => {
        const locale = v.lang.toLowerCase().replace("_", "-");
        if (!allowedLocales.has(locale)) return false;
        const baseName = v.name.split(" (")[0].trim();
        return !noveltyVoices.has(baseName);
      });

      englishVoices.forEach((voice, index) => {
        const option = document.createElement("option");
        option.value = voices.indexOf(voice);
        option.textContent = `${voice.name} (${voice.lang})`;
        if (index === 0) option.selected = true;
        voiceSelect.appendChild(option);
      });

      // Restore the previously chosen voice, if it's still available.
      const savedVoice = loadJson(PREFS_STORAGE).voice;
      if (savedVoice) {
        const opt = [...voiceSelect.options].find(o => o.textContent === savedVoice);
        if (opt) voiceSelect.value = opt.value;
      }
    }

    function cleanArticle(raw, title = "") {
      // Defensive markdown/preamble stripping (text mode removes most of this,
      // but Jina sometimes still returns markdown or a Title: preamble).
      const stripped = raw
        .replace(/^Title:.*$/gmi, "")
        .replace(/^URL Source:.*$/gmi, "")
        .replace(/^Published Time:.*$/gmi, "")
        .replace(/^Markdown Content:.*$/gmi, "")
        .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
        .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
        .replace(/^#{1,6}\s+/gm, "")    // markdown heading markers (not "C#"/"#1")
        .replace(/\*\*|__/g, "");
      const normalized = expandForSpeech(normalizeForSpeech(stripped));
      // Jina text mode puts each paragraph/heading on its own line. Keep those
      // line breaks (chunkArticle uses them for structure) and append a period
      // to prose lines lacking terminal punctuation (mostly list items) so the
      // voice pauses instead of running them into the next line. Headings need
      // no period: they become their own chunk, so a pause follows anyway.
      let lines = normalized
        .split(/\r?\n/)
        .map(l => l.replace(/\s+/g, " ").trim())
        .filter(Boolean);
      // Page furniture (dates, bylines, share links, related lists) — opt-out
      // via the "Trim article extras" checkbox. Runs before the period pass so
      // the patterns see the line exactly as the page wrote it.
      if (trimExtras.checked) {
        trimmedLines = [];
        lines = stripBoilerplate(lines, title, trimmedLines);
      }
      cleanedSource = lines
        .map(l => isHeadingLine(l) || /[.!?…:;)\]"'’”]$/.test(l) ? l : l + ".")
        .join("\n")
        .trim();
      return cleanedSource;
    }

    // --- Boilerplate trimming ------------------------------------------------
    // Everything here matches WHOLE lines: Jina's text mode puts each block on
    // its own line, so "Share" alone is a share button while "Share prices
    // fell..." is prose. Deliberately no LLM call — the signal is a line's
    // shape and position, which is cheap, offline, and debuggable. Patterns are
    // scoped to a zone (head / tail / anywhere) so a date in the article body
    // survives even though the dateline under the headline does not.

    // Junk lines, dropped wherever they appear. Full-line matches only.
    const JUNK_EXACT_RE = [
      /^(?:advertisement|advertisements|sponsored(?: content)?|promoted(?: content)?)$/i,
      /^listen(?: to this article)?$/i,
      /^\d+\s*(?:min(?:ute)?s?|hours?)\s*(?:read|listen)$/i,
      /^reading time\b.*$/i,
      /^\d[\d,.]*\s*[km]?\s*(?:comments?|views?|shares?|likes?|reads?)$/i,
      /^(?:getty images|reuters|associated press|ap photo|afp|shutterstock|unsplash|istock)\.?$/i,
      /^we use cookies\b.*$/i,
      /^(?:accept(?: all)?(?: cookies)?|reject all|manage (?:cookies|preferences)|cookie settings)$/i,
      /^(?:\d+\s+)+(?:next|previous|»)?$/i,     // pagination strips: "1 2 3 Next"
      /^@[\w.]+$/i,                             // a bare social handle
      // Player / consent / caption chrome seen on real pages (BBC, NPR, Verge,
      // Ars, TechCrunch, Wikipedia).
      /^(?:on|off|enabled|disabled|enableddisabled|customize|text settings|close modal|back to top)$/i,
      /^(?:hide|toggle) caption$/i,
      /^accessibility links?$/i,
      /^keyboard shortcuts\b.*$/i,
      /^press shift question mark\b.*$/i,
      /^(?:play|listen) live(?: radio)?$/i,
      /^view image in fullscreen$/i,
      /^(?:privacy center|your privacy choices|privacy preferences|tracking technologies)$/i,
      /^do not sell(?: or share)?\b.*$/i,
      /^from wikipedia, the free encyclopedia$/i,
      /^not to be confused with\b.*$/i,          // Wikipedia hatnote
      /^see also:\s*\S.*$/i,                     // Wikipedia inline cross-reference
      /^\([a-z]{2}(?:,\s*[a-z]{2})*\)$/i,        // editor initials, e.g. "(mb, yk)"
      /^(?:loading|error loading) the next article$/i,
      /^a flourish data visualization$/i,
      /^(?:learn more|minimize to nav|story text|start reading the article|about the author)$/i,
      /^size\b.*\bwidth\b.*\blinks\b.*$/i,       // Ars's font-size widget, one glued line
      /^(?:report|what's a) billboard\??$/i,
      // Membership/subscription pitch boxes, which sites inject mid-article
      // (the Guardian's sits between paragraphs, not at the end).
      /^support\s+(?:\$|\d)/i,
      /^(?:unlock all-access|far fewer asks|ad-free reading|unlimited access to|regular dispatches|cancel anytime)\b.*$/i,
      /^\d+\s*percent off$/i,
    ];

    // Junk lines that start with an innocent word, so they're only trusted when
    // the line is short and unpunctuated — i.e. a button label, not a sentence.
    // No trailing \b: real pages glue labels together ("SubscribeSign In").
    const JUNK_SHORT_RE = [
      /^share/i, /^copy (?:link|the link)/i, /^gift (?:this )?article/i,
      /^(?:save|print|email|text|tweet|post|pin) (?:this|article|story)?/i,
      /^(?:follow|connect with) (?:us|me|the author)/i,
      /^(?:sign|log) ?(?:in|up)/i, /^create account/i,
      /^subscribe/i, /^get (?:our )?newsletter/i, /^enter your email/i, /^join .* newsletter/i,
      /^already (?:have|a)\b/i,                  // "Already a subscriber? Sign in"
      /^(?:photos?|photographs?|images?|illustrations?|credits?|captions?)\s*[:—–-]/i,
      /^(?:photo|image|illustration|video|photograph)s?\s+(?:by|courtesy)\b/i,
      /^(?:leave|post) a comment/i, /^sign in to comment/i,
      /^most (?:popular|read|viewed)$/i,
      /^start (?:your|a) (?:trial|free trial)/i,
      /^(?:skip|jump) to/i,
    ];

    // Photo/wire credit lines and captions ending in a credit. Never terminally
    // punctuated, so a sentence like "..., Reuters reported." is untouched.
    const CREDIT_RE = /\b(?:getty images|ap photo|\/\s*ap|reuters|afp|shutterstock|bloomberg|epa|pa media|associated press)\b[^.!?]{0,40}$/i;

    // Bibliographic citations. Long and terminally punctuated, so they read as
    // prose to every other rule here, but nobody wants a reference list spoken
    // aloud. Each pattern needs a citation-only token, never bare prose shape.
    const CITATION_RE = [
      /^[↑^]\s/,                                          // Wikipedia back-links
      /\b(?:doi:|ISBN\b|arXiv:|PMID\b|PMC\d|S2CID\b|Bibcode:|ISSN\b)/i,
      /^[^.!?]{0,90}\(\d{4}\)\.\s*["“]/,                  // Author, A. (2024). "Title"
      /^[^.!?]{0,90}\(\d{4}-\d{2}-\d{2}\)\.\s*["“]/,
      /\bRetrieved\s+(?:\d{1,2}\s+\w+\s+\d{4}|\w+\s+\d{1,2},\s*\d{4}|\d{4}-\d{2}-\d{2})/i,
    ];

    // Cookie/consent modals arrive as real paragraphs, so shape alone can't
    // catch them; two independent signals must line up, and only near the top
    // of the page, so an article *about* cookie tracking survives.
    const CONSENT_TOPIC_RE = /\b(?:cookies?|tracking technolog\w+|consent (?:manager|preferences)|gdpr)\b/i;
    const CONSENT_UI_RE = /\b(?:opt[- ]out|third[- ]part\w+|your browser|this website|these cookies|preferences|consent|enable core|seamless user experience)\b/i;

    // Head-zone patterns: datelines, bylines and section kickers.
    const MONTHS = "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
    const HEAD_RE = [
      /^(?:published|posted|updated|last updated|first published|revised)\b.*$/i,
      new RegExp(`^(?:${MONTHS})\\s+\\d{1,2},?\\s*\\d{0,4}$`, "i"),
      new RegExp(`^\\d{1,2}\\s+(?:${MONTHS})\\.?,?\\s*\\d{0,4}$`, "i"),
      /^\d{4}-\d{2}-\d{2}\b.*$/i,
      /^\d{1,2}\/\d{1,2}\/\d{2,4}$/i,
      /^\d{1,2}:\d{2}\s*(?:[ap]\.?m\.?)?(?:\s+[a-z]{2,4})?\b.*$/i,   // "3:14 PM EDT ..."
      // "By Jane Doe and Sam Ray". Case-insensitive like everything else here;
      // what keeps prose out is the full-line anchor plus the word cap — a
      // sentence starting "by the time..." runs far past both.
      /^by\s+[\w.'’-]+(?:\s+(?:and\s+)?[\w.'’-]+){0,4}$/i,
      // Bylines glued to a timestamp, e.g. "by Jess WeatherbedJul 31, 2026".
      // Unpunctuated only, so a standfirst like "By all accounts, ..." survives.
      /^by\s+[^.!?]{2,80}$/i,
      /^(?:words|reported|written|photographs?|edited|illustrated)\s+by\b.*$/i,
      // "Sarah Rainsford,Southern and Eastern Europe correspondent" — a name
      // glued to a job title, which is a byline in every newsroom's markup.
      /^[^.!?]{0,80}\b(?:correspondent|reporter|editor|columnist|commentator|analyst|contributor|staff writer|news writer)s?$/i,
      /^(?:opinion|analysis|commentary|editorial|newsletter|exclusive|feature|interview|review|guest post|op-ed)$/i,
    ];

    // Tail-zone markers. From the first one onwards, nothing is article text.
    const TAIL_CUT_RE = [
      /^(?:related|related (?:articles|stories|reading|posts|content)|more (?:from|on|stories|like this)|read (?:more|next)|you (?:might|may) also like|recommended(?: for you)?|most (?:popular|read)|up next|see also|further reading)\b.*$/i,
      /^(?:tags?|topics?|filed under|categor(?:y|ies)|keywords)\s*:?.*$/i,
      /^(?:©|copyright)\b.*$/i,
      /^all rights reserved\b.*$/i,
      /^(?:terms of (?:service|use)|privacy policy|cookie policy|contact us|about us|advertise|newsletters?)$/i,
      /^(?:comments?|discussion|join the conversation)$/i,
      /^this (?:article|story|post) (?:was|first) (?:originally )?(?:published|appeared)\b.*$/i,
      /^(?:support our journalism|become a member|already a subscriber)\b.*$/i,
      /^continue reading with\b.*$/i,             // paywall pitch
      /^(?:loading|error loading) the next article$/i,
      /^do not sell(?: or share)?\b.*$/i,
      /^support (?:mission-driven|independent|local|public|our) \w+/i,
      /^most (?:viewed|popular|read)\b.*$/i,
      /^read the full article\b.*$/i,
      /^explore more on$/i,
      // A bare date line at the foot of the page heads a "more stories" list.
      new RegExp(`^(?:${MONTHS})\\.?\\s+\\d{1,2}$`, "i"),
    ];

    // Unambiguous end-of-article section headings — no article prose is a line
    // reading just "References". Strong enough to cut from further up the page
    // than the other markers (a Wikipedia citation list is half the document).
    const STRONG_TAIL_RE = [
      /^(?:references|external links|bibliography|notes|footnotes|further reading|citations|sources)$/i,
      /^for further actions\b.*$/i,               // dev.to's end-of-post block
      /^(?:top comments?|add to the discussion)\b.*$/i,
      /^explore more on$/i,
      /^(?:prev|previous|next) story$/i,
      // The closing byline: a name glued to a job title (the bio underneath it
      // is matched separately, by isBioLine).
      /^[^.!?]{0,80}\b(?:correspondent|reporter|editor|columnist|commentator|analyst|contributor|staff writer|news writer|science editor)s?$/i,
    ];

    // Job titles, the second half of what makes a line an author bio.
    const ROLE_RE = /\b(?:reporter|editor|writer|journalist|correspondent|columnist|author|founder|engineer|developer|designer|teacher|professor|researcher|analyst|consultant|coach|host|producer|contributor|blogger|scientist|photographer|critic|anchor)s?\b/i;

    // "Jane Doe is a reporter covering energy" / "I'm a teacher and developer".
    // Two independent requirements, because "X is a Y" is also an ordinary
    // sentence: the subject must be name-shaped (no stop words — that's what
    // keeps "The Schengen Area is a system of open borders" as article text)
    // and the predicate must name a job.
    // `shortName` allows a first-name-only subject ("Andy is a design founder"),
    // which is only safe where the position already says it's a bio — under an
    // "About the author" heading, or above the article's first paragraph.
    function isBioLine(line, shortName = false) {
      const names = shortName ? "{0,3}" : "{1,3}";
      const m = line.match(new RegExp(`^([\\w.'’-]+(?:\\s+[\\w.'’-]+)${names})\\s+is\\s+(?:an?|the)\\s+(.{0,160})$`, "i")) ||
                line.match(/^(I)'?m\s+(?:an?|the)\s+(.{0,160})$/i);
      if (!m || NAME_STOPWORDS.test(m[1])) return false;
      return ROLE_RE.test(m[2]);
    }

    // Words that a person's name doesn't contain — used to tell a byline
    // ("Kirsten Korosec") from a Title-Cased headline ("The Future Of Work").
    const NAME_STOPWORDS = /\b(?:the|a|an|of|in|on|for|and|to|with|from|at|by|is|are|was|were|how|why|what|when|your|our|my)\b/i;

    function isJunkLine(line) {
      if (JUNK_EXACT_RE.some(re => re.test(line))) return true;
      if (line.length <= 300 && CREDIT_RE.test(line)) return true;
      if (CITATION_RE.some(re => re.test(line))) return true;
      if (line.length <= 48 && /\bpromoted$/i.test(line)) return true;   // ad slot label
      const buttonish = line.length <= 48 && !/[.!?]$/.test(line);
      return buttonish && JUNK_SHORT_RE.some(re => re.test(line));
    }

    // A UI label rather than a sentence: short, unpunctuated, a handful of
    // words. On its own that also describes a heading, which is why only *runs*
    // of these are dropped (see stripBoilerplate) — nav bars, tag strips and
    // player controls arrive in blocks of four or more, headings never do.
    // `loose` widens the definition for the top of the page, where promo grids
    // and course lists run longer than a nav label ("Live UX Training — Smart
    // Interface Design Patterns"). Only used above the article, so a list of
    // real bullet points further down keeps the tighter limits.
    function isLabelLine(line, loose) {
      if (line.length > (loose ? 75 : 45)) return false;
      if (/[.!?…:;,]$/.test(line)) return false;
      if (/^(?:[-*•‣–—>]|\d+[.)])\s/.test(line)) return false;   // list item
      return line.split(/\s+/).length <= (loose ? 10 : 6);
    }

    // How boilerplate-ish a head-zone line looks. Scored rather than matched
    // outright so shape (short, title-cased, carries a year, no verb) can catch
    // datelines and kickers the patterns above don't spell out.
    function headScore(line, afterDropped) {
      let score = 0;
      if (HEAD_RE.some(re => re.test(line))) score += 3;
      if (line.length < 60 && !/[.!?]$/.test(line)) score += 1;
      if (/\b(?:19|20)\d{2}\b/.test(line) && line.length <= 40) score += 1;
      if (line.length <= 40 && line === line.toUpperCase() && /[A-Z]/.test(line)) score += 1;
      // A name-shaped line is a byline without the "By": 2-4 capitalised words,
      // no stop words (which is what keeps "The Future Of Work" out).
      if (line.length <= 32 && !NAME_STOPWORDS.test(line) &&
          /^[^\s]+(?:\s+[^\s]+){1,3}$/.test(line) &&
          line.split(/\s+/).every(w => /^[A-Z’'][\w.’'-]*$/.test(w))) score += 2;
      // A one- or two-word head line is a section kicker ("AI", "World News"),
      // never a headline.
      if (line.length <= 14 && line.split(/\s+/).length <= 2) score += 1;
      if (afterDropped) score += 1;                      // boilerplate arrives in clusters
      if (/\b(?:said|says|is|are|was|were|has|have|will|would|can|could|the)\b/i.test(line)) score -= 2;
      if (line.length > 120) score -= 3;
      return score;
    }

    // Drop the pre-article furniture and cut the post-article furniture, in
    // four passes. Order matters: junk and nav go first so the head zone is
    // located in what's left — real pages open with consent paragraphs and nav
    // blobs long enough to look like the first prose paragraph otherwise.
    function stripBoilerplate(lines, title = "", dropped = []) {
      // Lines this site was told to keep (see addKeepRule). Checked in every
      // pass rather than re-inserted afterwards, so order is never disturbed.
      const siteKeep = keepSet(trimHost);
      const protectedLine = (l) => siteKeep.size > 0 && siteKeep.has(normLine(l));

      let kept = cutTail(lines, dropped, protectedLine);
      let afterAuthorBox = false;
      kept = kept.filter((l, i) => {
        if (protectedLine(l)) return true;
        const consent = i < 25 && CONSENT_TOPIC_RE.test(l) && CONSENT_UI_RE.test(l);
        // An author box ("About the author" + one bio paragraph) can sit above
        // the article, not just below it, so the bio is matched by position
        // rather than by the tail rules.
        // The same bio also appears directly under the headline on some sites
        // (The Verge), where it precedes the article's first paragraph.
        // Directly under an "About the author" heading, position is evidence
        // enough — that paragraph is the bio whatever shape it takes. Higher up
        // the page it has to look like one.
        const bio = afterAuthorBox ? l.length <= 400 : (i < 8 && isBioLine(l, true));
        afterAuthorBox = /^about the author/i.test(l);
        if (!isJunkLine(l) && !consent && !bio) return true;
        dropped.push(l);
        return false;
      });

      // Navigation, tag strips, player controls, promo grids: blocks of four or
      // more consecutive label lines. This is the single biggest source of junk
      // in real dumps (a BBC page arrives with ~100 nav labels), and runs are
      // what separate it from a real heading, which always sits alone between
      // paragraphs. Skipped entirely if such runs are most of the page — that
      // means a link roundup, where the "nav" is the content.
      const runs = [];
      // A protected line is never a run member, which also breaks the run
      // around it — exactly what "keep this heading" should mean.
      const label = (i) => i < kept.length && !protectedLine(kept[i]) &&
        isLabelLine(kept[i], i < 15);
      for (let i = 0; i < kept.length; i++) {
        if (!label(i)) continue;
        let j = i;
        while (label(j + 1)) j++;
        if (j - i + 1 >= 4) runs.push([i, j]);
        i = j;
      }
      const runChars = runs.reduce((n, [a, b]) =>
        n + kept.slice(a, b + 1).reduce((m, l) => m + l.length, 0), 0);
      const allChars = kept.reduce((n, l) => n + l.length, 0);
      if (runs.length && runChars < allChars * 0.5) {
        const inRun = new Set();
        runs.forEach(([a, b]) => { for (let k = a; k <= b; k++) inRun.add(k); });
        kept = kept.filter((l, i) => {
          if (!inRun.has(i)) return true;
          dropped.push(l);
          return false;
        });
      }

      // Head zone: everything before the first real prose paragraph (long, and
      // ending in a sentence) is headline/dateline/byline land. Capped at 8
      // lines so an article that opens with short paragraphs keeps them.
      const firstProse = kept.findIndex(isProseLine);
      const headEnd = Math.min(firstProse === -1 ? 6 : firstProse, 8);
      const norm = (s) => s.toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
      const titleNorm = norm(title);
      let lastDropped = false;
      kept = kept.filter((line, i) => {
        if (i >= headEnd || protectedLine(line)) return true;
        // The headline often repeats the page title, which we already track.
        const dupTitle = titleNorm && norm(line) === titleNorm;
        const drop = dupTitle || headScore(line, lastDropped) >= 3;
        lastDropped = drop;
        if (drop) dropped.push(line);
        return !drop;
      });

      // Auditable twice over: the caller lists the drops under the title, and
      // the console keeps the full detail for tuning a pattern.
      if (dropped.length) console.debug("[article-reader] trimmed extras:", dropped);
      return kept;
    }

    // Cut from the first tail marker in the closing stretch of the page. Runs
    // before anything else is dropped, because the marker is often junk in its
    // own right ("Most read", "Related") — remove it first and the anchor for
    // the cut is gone. The guard is character-based, not line-based: the cut
    // only stands if most of the text is still above it, so a mid-article
    // "Read more" box can't take the second half of the article with it.
    function cutTail(lines, dropped, protectedLine = () => false) {
      const totalChars = lines.reduce((n, l) => n + l.length, 0);
      const tailStart = Math.max(1, lines.length - 60);
      let charsAbove = 0;
      for (let i = 0; i < lines.length; i++) {
        // A cut marker is a label or a link line, never a full paragraph — the
        // length cap is what keeps prose like "Related work continues at..."
        // from ending the article. A marker the site was told to keep can't
        // start a cut either.
        if (protectedLine(lines[i])) { charsAbove += lines[i].length; continue; }
        const strong = STRONG_TAIL_RE.some(re => re.test(lines[i]));
        const matches = strong || isBioLine(lines[i]) || TAIL_CUT_RE.some(re => re.test(lines[i]));
        if (matches && lines[i].length <= 160 &&
            (strong || i >= tailStart) &&
            charsAbove >= totalChars * (strong ? 0.4 : 0.6) &&
            !proseFollows(lines, i)) {
          dropped.push(...lines.slice(i));
          return lines.slice(0, i);
        }
        charsAbove += lines[i].length;
      }
      return lines;
    }

    // The last guard on a tail cut: whatever follows the marker must not read
    // like article prose. Link lists, tag strips and citation lists are short
    // lines; body paragraphs are long ones that end in a sentence.
    function proseFollows(lines, i) {
      const rest = lines.slice(i + 1);
      if (!rest.length) return false;
      return rest.filter(isProseLine).length / rest.length >= 0.2;
    }

    // Long and terminally punctuated — but a citation is both of those and is
    // not prose, which is exactly what a reference list at the foot of a
    // Wikipedia article is made of.
    function isProseLine(line) {
      return line.length > 180 && /[.!?…"'’”]$/.test(line) &&
        !CITATION_RE.some(re => re.test(line));
    }

    // A line that reads like a section title rather than prose. Jina's text
    // mode drops the markdown "#", so shape is all we have: short, few words,
    // not a list item or blockquote, and no terminal punctuation — except "?"
    // and "!", which standalone lines this short are almost always titles
    // ("What About Costs?"). A period is excluded: too many one-line
    // paragraphs would be mistaken for headings.
    function isHeadingLine(line) {
      const l = line.trim();
      if (!l || l.length > 90) return false;
      if (/[.…,;:)\]"'’”]$/.test(l)) return false;         // prose, or a lead-in line
      if (/^(?:[-*•‣–—>]|\d+[.)])\s/.test(l)) return false;  // list item / quote
      return l.split(/\s+/).length <= 12;
    }

    // Remove leftover bits that get read aloud awkwardly: reference markers,
    // editorial notes, and navigation remnants.
    function normalizeForSpeech(text) {
      return text
        // Leaked web-component <style> CSS (e.g. X/Twitter shadow DOM counters).
        // Only strip rule-runs that contain CSS-only tokens (":host", minified
        // declarations) so code blocks and JSON are left untouched.
        .replace(/(?:[^{}\n]*\{[^{}]*\})+/g, m =>
          /:host|white-space:|will-change:|display:inline-|line-height:|--[\w-]+:/.test(m) ? "" : m)
        // No leading \b: pages glue skip links together, e.g.
        // "Skip to main contentSkip to navigation".
        .replace(/(?:Jump|Skip) to (?:main |list of )?(?:content|navigation|search|all articles|all topics)/gi, "")
        // Standalone ad/label lines (not the word mid-sentence).
        .replace(/^[ \t]*(?:advertisement|sponsored(?: content)?|promoted content)[ \t]*$/gim, "")
        .replace(/\[\d+\](?:\[\d+\])*/g, "")  // [12] or [12][13] reference marks
        .replace(/\[[^\]]*\b(?:citation|edit|when|update|clarif\w*|source|verification|dead link|page needed|according to whom|by whom|vague|note)\b[^\]]*\]/gi, "")
        .replace(/\[(?:\?|…|\.\.\.)\]/g, "");
    }

    // Expand symbols, currencies, and common abbreviations into words so the
    // voice says them naturally ("50%" -> "50 percent") instead of spelling
    // them out or mispronouncing them. Conservative to avoid wrong guesses.
    function expandForSpeech(text) {
      return text
        // strip emoji / pictographs / arrows (read aloud as "smiling face" etc.)
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu, "")
        // common Latin abbreviations (also drops the period that breaks pauses)
        .replace(/\be\.g\.\s*/gi, "for example ")
        .replace(/\bi\.e\.\s*/gi, "that is ")
        .replace(/\betc\b\.?/gi, "et cetera")
        .replace(/\bvs\b\.?/gi, "versus")
        // currency: scale-word form first, then plain amounts
        .replace(/\$\s?(\d[\d,]*(?:\.\d+)?)\s+(trillion|billion|million|thousand)\b/gi, "$1 $2 dollars")
        .replace(/\$\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 dollars")
        .replace(/€\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 euros")
        .replace(/£\s?(\d[\d,]*(?:\.\d+)?)/g, "$1 pounds")
        // percent
        .replace(/(\d)\s*%/g, "$1 percent")
        // ampersand
        .replace(/\s*&\s*/g, " and ")
        // numeric ranges (en/em dash, or spaced hyphen) -> "to"; leaves ISO
        // dates like 2025-08-27 untouched (plain hyphen, no spaces)
        .replace(/(\d)\s*[–—]\s*(\d)/g, "$1 to $2")
        .replace(/(\d)\s+-\s+(\d)/g, "$1 to $2")
        // "#5" -> "number 5" (leaves "C#" alone)
        .replace(/#(\d)/g, "number $1")
        // degrees
        .replace(/°\s?([CF])\b/g, " degrees $1")
        .replace(/°/g, " degrees ")
        // collapse repeated terminal punctuation ("!!!" -> "!")
        .replace(/([!?])\1+/g, "$1");
    }

    // Build a readable title from a URL slug when Jina gives no Title: line.
    function titleFromUrl(u) {
      try {
        const path = new URL(u).pathname.split("/").filter(Boolean).pop() || "";
        const slug = decodeURIComponent(path)
          .replace(/\.[a-z0-9]+$/i, "")
          .replace(/[-_]+/g, " ")
          .trim();
        return slug ? slug.replace(/\b\w/g, c => c.toUpperCase()) : "Article";
      } catch { return "Article"; }
    }

    function splitText(text, maxLen) {
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      const result = [];
      let current = "";

      for (const sentence of sentences) {
        if ((current + sentence).length > maxLen) {
          if (current) result.push(current.trim());
          current = sentence;
        } else {
          current += " " + sentence;
        }
      }

      if (current.trim()) result.push(current.trim());
      return result;
    }

    // Chunk the article without letting a chunk straddle a heading: each
    // heading line becomes a chunk of its own (so the reading view can style
    // it, and both engines pause after it), and the prose in between is filled
    // to maxLen exactly as before. Records the kind of each chunk in
    // chunkKinds, which renderChunks() turns into styling.
    function chunkArticle(text, maxLen) {
      const result = [];
      const kinds = [];
      let prose = [];
      const flushProse = () => {
        if (!prose.length) return;
        let text = prose.join(" ");
        // The very first chunk is capped short: it's the one the listener waits
        // on, and the double-buffered prefetch has the rest ready by the time
        // it ends. Skipped when a heading already opened the article, since a
        // heading chunk is short anyway.
        if (!result.length) {
          const parts = splitText(text, FIRST_CHUNK_SIZE);
          if (parts.length > 1) {
            result.push(parts[0]);
            kinds.push("body");
            text = parts.slice(1).join(" ");
          }
        }
        for (const c of splitText(text, maxLen)) { result.push(c); kinds.push("body"); }
        prose = [];
      };
      for (const line of text.split("\n").map(l => l.trim()).filter(Boolean)) {
        if (isHeadingLine(line)) {
          flushProse();
          result.push(line);
          kinds.push("heading");
        } else {
          prose.push(line);
        }
      }
      flushProse();
      chunkKinds = kinds;
      return result;
    }

    function selectedVoice() {
      return voices[Number(voiceSelect.value)] || null;
    }

    // --- Sentence-level navigation ------------------------------------------

    // Record where each sentence begins inside each chunk (same sentence
    // regex as splitText, so boundaries agree).
    function computeSentenceStarts() {
      sentenceStarts = chunks.map(text => {
        const re = /[^.!?]+[.!?]+|[^.!?]+$/g;
        const starts = [];
        let m;
        while ((m = re.exec(text))) {
          const lead = m[0].match(/^\s*/)[0].length;  // skip leading whitespace
          starts.push(m.index + lead);
        }
        return starts.length ? starts : [0];
      });
    }

    // Best estimate of the spoken position (char offset) in the current chunk.
    function currentCharPos() {
      if (activeEngine() === "cloudflare") {
        // TTS speed is roughly constant, so time maps linearly to characters.
        const el = cfAudio();
        const d = el.duration;
        if (isFinite(d) && d > 0) {
          return Math.floor((el.currentTime / d) * chunks[chunkIndex].length);
        }
        return chunkCharOffset;
      }
      return lastBoundaryAbs;
    }

    function sentenceIndexAt(chunkI, pos) {
      const starts = sentenceStarts[chunkI] || [0];
      let si = 0;
      for (let i = 0; i < starts.length; i++) if (starts[i] <= pos) si = i;
      return si;
    }

    function stepSentence(delta) {
      if (playbackState === "idle" || !chunks.length) return;
      const starts = sentenceStarts[chunkIndex] || [0];
      const target = sentenceIndexAt(chunkIndex, currentCharPos()) + delta;
      if (target < 0) {
        // Cross back into the previous chunk's last sentence.
        if (chunkIndex > 0) {
          const prev = sentenceStarts[chunkIndex - 1] || [0];
          playFrom(chunkIndex - 1, prev[prev.length - 1]);
        } else {
          playFrom(0, 0);
        }
      } else if (target >= starts.length) {
        if (chunkIndex < chunks.length - 1) playFrom(chunkIndex + 1, 0);
      } else {
        playFrom(chunkIndex, starts[target]);
      }
    }

    // Char offset of a click inside a chunk element, so a tap on any sentence
    // in the reading view can start playback there. Works whether the chunk
    // holds plain text or per-word spans (their text nodes concatenate to the
    // full chunk text). Falls back to 0 (chunk start).
    function charOffsetFromPoint(el, x, y) {
      let node = null, offset = 0;
      if (document.caretRangeFromPoint) {
        const r = document.caretRangeFromPoint(x, y);
        if (r) { node = r.startContainer; offset = r.startOffset; }
      } else if (document.caretPositionFromPoint) {
        const p = document.caretPositionFromPoint(x, y);
        if (p) { node = p.offsetNode; offset = p.offset; }
      }
      if (!node || !el.contains(node)) return 0;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let total = 0;
      while (walker.nextNode()) {
        if (walker.currentNode === node) return total + offset;
        total += walker.currentNode.textContent.length;
      }
      return 0;
    }

    // Single play/pause toggle, driven by real playback state:
    //   idle    -> disabled, shows ▶
    //   playing -> enabled,  shows ⏸ (click to pause)
    //   paused  -> enabled,  shows ▶ (click to resume)
    function setControls(state) {
      playbackState = state;
      playPauseButton.disabled = state === "idle";
      const playing = state === "playing";
      playPauseButton.textContent = playing ? PAUSE_ICON : PLAY_ICON;
      playPauseButton.setAttribute(
        "aria-label",
        playing ? "Pause" : state === "paused" ? "Resume" : "Play"
      );
      updateNav();
      updateMediaSession();
      syncWakeLock();
      if (state === "idle") renderRecent();
    }

    function updateNav() {
      // Prev/Next available whenever something is loaded (playing or paused).
      // Prev stays enabled on the first section — it restarts the section.
      prevButton.disabled = playbackState === "idle";
      nextButton.disabled = playbackState === "idle" || chunkIndex >= chunks.length - 1;
      restartButton.disabled = playbackState === "idle";
      prevSentenceButton.disabled = playbackState === "idle";
      nextSentenceButton.disabled = playbackState === "idle";
    }

    // Render the article into the reading view, one clickable block per chunk.
    function renderChunks() {
      readerEl.innerHTML = "";
      chunkEls = chunks.map((text, i) => {
        const el = document.createElement("span");
        el.className = chunkKinds[i] === "heading" ? "chunk heading" : "chunk";
        el.textContent = text;
        el.addEventListener("click", (e) => {
          if (suppressClick) { suppressClick = false; return; }  // that was a gesture
          // Start from the tapped sentence, not just the chunk.
          const pos = charOffsetFromPoint(el, e.clientX, e.clientY);
          const starts = sentenceStarts[i] || [0];
          playFrom(i, starts[sentenceIndexAt(i, pos)]);
        });
        readerEl.appendChild(el);
        return el;
      });
      readerEl.classList.toggle("active", chunks.length > 0);
      progressEl.classList.toggle("active", chunks.length > 0);
      renderArticleHeader();
      updateProgress();
    }

    // --- Article header (title + what the trim removed) ---------------------

    function renderArticleHeader() {
      const show = chunks.length > 0;
      articleHeader.classList.toggle("active", show);
      readerBar.classList.toggle("active", show);
      articleTitleEl.textContent = show ? articleTitle : "";
      const n = trimmedLines.length;
      const hasRules = Boolean(trimHost) && keepSet(trimHost).size > 0;
      trimInfo.hidden = !show || (!n && !hasRules);
      trimInfo.open = false;
      if (trimInfo.hidden) return;
      trimSummary.textContent = n
        ? `Trimmed ${n} extra${n === 1 ? "" : "s"} — show`
        : "Nothing trimmed — show settings";
      trimList.innerHTML = "";
      // Cap the list: a Wikipedia reference section runs to hundreds of lines.
      for (const line of trimmedLines.slice(0, 60)) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "trim-line";
        el.textContent = line;
        el.title = trimHost
          ? `Keep this line — always, on ${trimHost}`
          : "Keep this line (load an article by URL to remember it)";
        el.addEventListener("click", () => keepTrimmedLine(line));
        trimList.appendChild(el);
      }
      if (n > 60) {
        const more = document.createElement("span");
        more.className = "trim-more";
        more.textContent = `…and ${n - 60} more`;
        trimList.appendChild(more);
      }
      if (hasRules) {
        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "trim-reset";
        reset.textContent = `Reset kept lines for ${trimHost}`;
        reset.addEventListener("click", () => {
          clearSiteRules(trimHost);
          recleanInPlace();
        });
        trimList.appendChild(reset);
      }
    }

    // "This isn't junk on this site." Remembered per hostname, then applied
    // immediately if the raw extraction is still around to re-clean.
    function keepTrimmedLine(line) {
      if (!trimHost) {
        setStatus("Load an article by URL to remember kept lines per site.");
        return;
      }
      addKeepRule(trimHost, line);
      if (!rawArticle) {
        setStatus("Saved — this line will be kept next time you open this site.");
        renderArticleHeader();
        return;
      }
      recleanInPlace();
    }

    // Re-clean the loaded article from the retained extraction and carry the
    // listening position across (the text length changes, so map by character).
    function recleanInPlace() {
      if (!rawArticle) return;
      const consumed = chunks.slice(0, chunkIndex).reduce((n, c) => n + c.length + 1, 0) + chunkCharOffset;
      const before = textArea.value.length || 1;
      const text = cleanArticle(rawArticle, articleTitle);
      textArea.value = text;
      readText(text, 0, chunks.length ? Math.floor((consumed / before) * text.length) : null);
    }

    // Jina's text mode returns no "Title:" line, so the best available title is
    // usually the article's own first heading; the URL slug is the fallback.
    function deriveTitle(cleaned, url, jinaTitle) {
      if (jinaTitle) return jinaTitle;
      const first = cleaned.split("\n")[0] || "";
      if (first && isHeadingLine(first) && first.length >= 12) return first;
      return titleFromUrl(url);
    }

    // --- Reading view comfort ----------------------------------------------

    function applyReadScale() {
      readerEl.style.setProperty("--read-scale", readScale.toFixed(2));
      fontDown.disabled = readScale <= 0.85;
      fontUp.disabled = readScale >= 1.8;
    }

    function nudgeReadScale(step) {
      readScale = Math.min(1.8, Math.max(0.85, Math.round((readScale + step) * 100) / 100));
      applyReadScale();
      savePrefs();
    }

    function toggleImmersive(force) {
      const on = force !== undefined ? force : !document.body.classList.contains("immersive");
      document.body.classList.toggle("immersive", on);
      immersiveButton.setAttribute("aria-pressed", String(on));
      immersiveButton.title = on ? "Exit full-screen reading mode" : "Full-screen reading mode";
      immersiveButton.innerHTML = on ? "&#10005;" : "&#9974;";    // ✕ close / ⛶ full screen
      if (on) readerBar.insertBefore(speedBox, readerBar.firstChild);
      else speedHome.appendChild(speedBox);
      updateFsMeta();
      if (on && chunkEls[chunkIndex]) chunkEls[chunkIndex].scrollIntoView({ block: "center" });
    }

    function updateProgress() {
      const pct = chunks.length ? ((chunkIndex + 1) / chunks.length) * 100 : 0;
      progressBar.style.width = pct + "%";
      updateEta();
    }

    // Rough estimate of time left, based on characters remaining and speed.
    function updateEta() {
      if (!chunks.length || playbackState === "idle") {
        etaLabel = "";
      } else {
        let remaining = 0;
        for (let i = chunkIndex; i < chunks.length; i++) remaining += chunks[i].length;
        const rate = Number(rateInput.value) || 1;
        const secs = remaining / (CHARS_PER_SEC * rate);
        etaLabel = secs >= 90
          ? `~${Math.round(secs / 60)} min left`
          : `~${Math.max(1, Math.round(secs))} sec left`;
      }
      etaEl.textContent = etaLabel;
      updateFsMeta();
    }

    // The full-screen toolbar has no room for the "Speed: 1.15x" label the
    // settings pane carries, so speed and time left share one compact readout.
    function updateFsMeta() {
      const rate = (Number(rateInput.value) || 1).toFixed(2) + "×";
      fsMeta.textContent = etaLabel ? `${rate} · ${etaLabel}` : rate;
    }

    // --- Per-word highlighting (browser engine) ----------------------------

    // Restore the word/sentence-spanned chunk back to plain text.
    function clearWordSpans() {
      if (wordSpanIndex >= 0 && chunkEls[wordSpanIndex]) {
        chunkEls[wordSpanIndex].textContent = chunks[wordSpanIndex];
      }
      currentWordSpans = [];
      wordSpanIndex = -1;
      if (sentenceSpanIndex >= 0 && chunkEls[sentenceSpanIndex]) {
        chunkEls[sentenceSpanIndex].textContent = chunks[sentenceSpanIndex];
      }
      currentSentenceSpans = [];
      sentenceSpanIndex = -1;
    }

    // Split the active chunk into one span per sentence (their text nodes
    // still concatenate to the full chunk text, so tap-to-sentence keeps
    // working). The first segment starts at 0 to cover any leading space.
    function buildSentenceSpans(index) {
      const el = chunkEls[index];
      if (!el) return;
      const text = chunks[index];
      const starts = sentenceStarts[index] || [0];
      el.textContent = "";
      currentSentenceSpans = starts.map((s, j) => {
        const from = j === 0 ? 0 : s;
        const to = j + 1 < starts.length ? starts[j + 1] : text.length;
        const span = document.createElement("span");
        span.textContent = text.slice(from, to);
        el.appendChild(span);
        return { el: span };
      });
      sentenceSpanIndex = index;
      // The word spans (if any) were just replaced by the sentence spans.
      if (wordSpanIndex === index) { currentWordSpans = []; wordSpanIndex = -1; }
    }

    // Some browser voices never fire onboundary (Android Chrome's network
    // voices, iOS Safari). After a short grace period with no boundary events,
    // fall back to time-estimated sentence highlighting, like the premium
    // engine. The estimate also feeds lastBoundaryAbs so sentence prev/next
    // stays roughly in sync.
    const SPEECH_CHARS_PER_SEC = 15;  // ~180 wpm at rate 1
    function startSpeechTick(utterance, startOffset, hasBoundary) {
      clearInterval(speechTickTimer);
      let lastTick = Date.now();
      let played = 0;  // ms actually speaking (excludes paused time)
      speechTickTimer = setInterval(() => {
        if (utterance !== currentUtterance || hasBoundary()) {
          clearInterval(speechTickTimer);
          return;
        }
        const now = Date.now();
        if (!speechSynthesis.paused) played += now - lastTick;
        lastTick = now;
        if (played < 1500) return;  // grace: real boundary events start immediately
        if (sentenceSpanIndex !== chunkIndex) buildSentenceSpans(chunkIndex);
        const pos = Math.min(
          startOffset + (played / 1000) * SPEECH_CHARS_PER_SEC * Number(rateInput.value),
          chunks[chunkIndex].length - 1);
        lastBoundaryAbs = pos;
        const si = sentenceIndexAt(chunkIndex, pos);
